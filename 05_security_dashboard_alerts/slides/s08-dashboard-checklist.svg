<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">대시보드 알림 체크리스트</title><desc id="d">5단계 지표 집계와 Critical 알림 확인</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#65dfa0}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.p{fill:var(--muted);font-size:19px}.mark{fill:var(--accent);font-size:24px;font-weight:700}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--accent:#16704a}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">5단계 · 복습 체크리스트</text><text class="sub" x="60" y="145">지표는 추세를, 알림은 긴급 대응을 지원하는가</text><rect class="panel" x="80" y="230" width="1120" height="280" rx="16"/><text class="mark" x="120" y="300">✓</text><text class="p" x="165" y="300">차단·검토·카테고리·위험 분포를 집계한다</text><text class="mark" x="120" y="370">✓</text><text class="p" x="165" y="370">Critical 이벤트만 알림 payload로 전달한다</text><text class="mark" x="120" y="440">✓</text><text class="p" x="165" y="440">대시보드와 알림에 민감정보 원문을 넣지 않는다</text><text class="foot" x="60" y="666">5단계 · 8 / 9</text></svg>
