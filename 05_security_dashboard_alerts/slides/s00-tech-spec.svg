<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">5단계 학습 기술 사양</title><desc id="d">FastAPI 기반 보안 관제 API에 필요한 기술</desc><style>:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#e7f6ee;--line:#16704a}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.title{fill:var(--ink);font-size:40px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.h{fill:var(--ink);font-size:24px;font-weight:700}.p{fill:var(--muted);font-size:19px}.code{fill:var(--ink);font-family:monospace;font-size:17px}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--ink:#f3f7fb;--muted:#b5c2d1;--panel:#183d2d;--line:#65dfa0}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="110">5단계 · 학습 기술 사양</text><text class="sub" x="60" y="150">보안 이벤트를 HTTP API와 운영 지표로 제공한다</text><rect class="panel" x="80" y="230" width="520" height="270" rx="16"/><text class="h" x="115" y="285">필수</text><text class="p" x="115" y="330">Python 3.12+ 권장 · FastAPI · Uvicorn</text><text class="p" x="115" y="370">requirements.txt 설치</text><text class="code" x="115" y="410">uvicorn api:app --app-dir src</text><rect class="panel" x="660" y="230" width="540" height="270" rx="16"/><text class="h" x="695" y="285">API 학습 범위</text><text class="code" x="695" y="330">POST /events · GET /metrics</text><text class="code" x="695" y="370">GET /alerts/critical · /docs</text><text class="p" x="695" y="420">계약: metrics-v1 · results/step05-metrics.json</text><text class="p" x="695" y="455">SQLite · API Key · 웹 대시보드 · 운영 시 PostgreSQL 검토</text><text class="foot" x="60" y="666">참고 기술 사양 · 5단계</text></svg>
