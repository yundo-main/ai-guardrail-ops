<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">대시보드와 알림 이론</title><desc id="d">보안 이벤트를 운영 지표와 Critical 알림으로 연결</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--blue:#173b63;--green:#183d2d;--orange:#3b2b18;--accent:#60aef5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.box{fill:var(--blue);stroke:var(--accent);stroke-width:2}.control{fill:var(--green);stroke:#65dfa0;stroke-width:2}.warn{fill:var(--orange);stroke:#ffc267;stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:18px}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--blue:#e8f2fb;--green:#e7f6ee;--orange:#fff4df;--accent:#1769aa}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">5단계 · 이론: 운영 지표와 알림</text><text class="sub" x="60" y="145">지표는 추세를, 알림은 즉시 대응을 지원한다</text><text class="sub" x="60" y="185">배경: 차단 결과를 운영 지표와 알림으로 연결해야 방어 체계를 개선할 수 있다</text><rect class="box" x="80" y="250" width="330" height="210" rx="16"/><text class="h" x="115" y="300">핵심 지표</text><text class="p" x="115" y="345">전체·차단·검토 건수</text><text class="p" x="115" y="380">카테고리별 분포</text><text class="p" x="115" y="415">위험 등급 분포</text><rect class="control" x="475" y="250" width="330" height="210" rx="16"/><text class="h" x="510" y="300">대시보드</text><text class="p" x="510" y="345">운영자가 추세 확인</text><text class="p" x="510" y="380">정책 변경 효과 비교</text><text class="p" x="510" y="415">미대응 이슈 추적</text><rect class="warn" x="870" y="250" width="330" height="210" rx="16"/><text class="h" x="905" y="300">Critical 알림</text><text class="p" x="905" y="345">조건: risk = Critical</text><text class="p" x="905" y="380">채널: Slack·이메일</text><text class="p" x="905" y="415">payload에 증거 포함</text><text class="foot" x="60" y="666">5단계 · 5단계 · 2 / 9</text></svg>
