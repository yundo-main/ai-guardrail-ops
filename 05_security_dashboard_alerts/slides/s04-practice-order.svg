<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
  <title id="t">5단계 · 실습 순서</title>
  <desc id="d">05단계 실습을 순서대로 실행하는 단계별 명령 안내</desc>
  <style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#65dfa0}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.p{fill:var(--muted);font-size:19px}.mark{fill:var(--accent);font-size:24px;font-weight:700}.foot{fill:var(--muted);font-size:14px}.h{fill:var(--ink);font-weight:700}.code{fill:var(--accent);font-family:Menlo,Consolas,"Courier New",monospace}.codebox{fill:var(--bg);stroke:var(--line);stroke-width:1.5}.arrow{stroke:var(--accent);stroke-width:3;fill:none}.mk{fill:var(--accent)}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--accent:#16704a}}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="60" y="90">5단계 · 실습 순서</text>
  <text class="sub" x="60" y="126">이벤트 API를 띄워 지표·알림·리포트를 확인한다</text>

  <rect class="panel" x="60" y="160" width="560" height="474" rx="16"/>
  <text class="h" x="90" y="205" font-size="24">실습 순서</text>
    <rect class="codebox" x="95" y="225" width="480" height="56" rx="10"/>
    <circle cx="122" cy="253" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="258" font-size="14" text-anchor="middle">1</text>
    <text class="p" x="148" y="247" font-size="14">의존성 설치</text>
    <text class="code" x="148" y="268" font-size="12">python3 -m pip install -r 05_security_dashboard_alerts/requirements.txt</text>
    <path class="arrow" d="M340 281 V289"/>
    <rect class="codebox" x="95" y="295" width="480" height="56" rx="10"/>
    <circle cx="122" cy="323" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="328" font-size="14" text-anchor="middle">2</text>
    <text class="p" x="148" y="317" font-size="14">서버 실행</text>
    <text class="code" x="148" y="338" font-size="12">uvicorn api:app --app-dir 05_security_dashboard_alerts/src --port 8000</text>
    <path class="arrow" d="M340 351 V359"/>
    <rect class="codebox" x="95" y="365" width="480" height="56" rx="10"/>
    <circle cx="122" cy="393" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="398" font-size="14" text-anchor="middle">3</text>
    <text class="p" x="148" y="387" font-size="14">이벤트 등록·조회</text>
    <text class="code" x="148" y="408" font-size="12">POST /events (04 결과) → GET /metrics · /dashboard · /alerts/critical</text>
    <path class="arrow" d="M340 421 V429"/>
    <rect class="codebox" x="95" y="435" width="480" height="56" rx="10"/>
    <circle cx="122" cy="463" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="468" font-size="14" text-anchor="middle">4</text>
    <text class="p" x="148" y="457" font-size="14">리포트 생성</text>
    <text class="code" x="148" y="478" font-size="12">python3 05_security_dashboard_alerts/src/report.py</text>
    <path class="arrow" d="M340 491 V499"/>
    <rect class="codebox" x="95" y="505" width="480" height="56" rx="10"/>
    <circle cx="122" cy="533" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="538" font-size="14" text-anchor="middle">5</text>
    <text class="p" x="148" y="527" font-size="14">Discord 알림 (선택)</text>
    <text class="code" x="148" y="548" font-size="12">discord.py WEBHOOK_URL 입력 → Critical 이벤트 등록</text>
    <path class="arrow" d="M340 561 V569"/>
    <rect class="codebox" x="95" y="575" width="480" height="56" rx="10"/>
    <circle cx="122" cy="603" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="608" font-size="14" text-anchor="middle">6</text>
    <text class="p" x="148" y="597" font-size="14">단위 테스트 (선택)</text>
    <text class="code" x="148" y="618" font-size="12">python3 -m unittest discover -s 05_security_dashboard_alerts/tests -v</text>

  <rect class="panel" x="660" y="160" width="560" height="474" rx="16"/>
  <text class="h" x="690" y="205" font-size="24">산출물 · 주의</text>
    <text class="p" x="700" y="250" font-size="15">• API 키: X-API-Key 헤더 (기본 dev-only-key)</text>
    <text class="p" x="700" y="284" font-size="15">• 산출물: results/step05-metrics.json + .html → 6단계 입력</text>
    <text class="p" x="700" y="318" font-size="15">• 웹훅 URL은 환경변수로만 관리</text>

  <text class="foot" x="60" y="705">5단계 · 실습 순서 · 4 / 9</text>
</svg>
