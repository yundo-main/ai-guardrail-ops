<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">보안 대시보드 및 알림 구축</title><desc id="d">이벤트 집계, 대시보드, Critical 알림 연결</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--blue:#173b63;--green:#183d2d;--orange:#3b2b18;--line:#8fa5bd;--accent:#60aef5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:40px;font-weight:700}.sub,.small{fill:var(--muted);font-size:20px}.box{fill:var(--blue);stroke:var(--accent);stroke-width:2}.control{fill:var(--green);stroke:#65dfa0;stroke-width:2}.warn{fill:var(--orange);stroke:#ffc267;stroke-width:2}.txt{fill:var(--ink);font-size:22px;font-weight:700}.line{stroke:var(--line);stroke-width:3}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--blue:#e8f2fb;--green:#e7f6ee;--orange:#fff4df;--accent:#1769aa;--line:#9aabba}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="110">5단계 · 보안 대시보드 및 알림 구축</text><text class="sub" x="60" y="150">운영 지표를 집계하고 Critical 이벤트를 즉시 전달한다</text><g text-anchor="middle"><rect class="box" x="80" y="280" width="230" height="130" rx="16"/><text class="txt" x="195" y="330">보안 이벤트</text><text class="small" x="195" y="370">차단·검토·등급</text><rect class="control" x="370" y="280" width="230" height="130" rx="16"/><text class="txt" x="485" y="330">집계 지표</text><text class="small" x="485" y="370">카테고리·위험 분포</text><rect class="control" x="660" y="280" width="230" height="130" rx="16"/><text class="txt" x="775" y="330">대시보드</text><text class="small" x="775" y="370">운영 현황 시각화</text><rect class="warn" x="950" y="280" width="230" height="130" rx="16"/><text class="txt" x="1065" y="330">Critical 알림</text><text class="small" x="1065" y="370">Slack·이메일 payload</text></g><path class="line" d="M310 345h60M600 345h60M890 345h60"/><text class="foot" x="60" y="666">5단계 · 5단계 · 1 / 9</text></svg>
