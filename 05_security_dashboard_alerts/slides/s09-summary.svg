<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">대시보드와 알림 요약</title><desc id="d">5단계 지표와 알림 운영 질문</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#ffc267}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:19px}.accent{fill:var(--accent);font-size:19px;font-weight:700}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">5단계 · 핵심 요약과 실습 질문</text><text class="sub" x="60" y="145">운영자는 추세와 긴급 사건을 서로 다른 화면에서 본다</text><rect class="panel" x="80" y="230" width="520" height="280" rx="16"/><text class="h" x="115" y="280">핵심 메시지</text><text class="p" x="115" y="330">차단율과 위험 분포로 정책 효과를 본다</text><text class="p" x="115" y="370">Critical만 즉시 알림해 알림 피로를 줄인다</text><text class="p" x="115" y="410">대시보드와 알림에 원문 비밀을 넣지 않는다</text><rect class="panel" x="660" y="230" width="540" height="280" rx="16"/><text class="h" x="695" y="280">실습 질문</text><text class="accent" x="695" y="330">운영 의사결정에 필요한 지표인가?</text><text class="accent" x="695" y="370">알림 확인·재시도 상태가 있는가?</text><text class="accent" x="695" y="410">dashboard_payload()를 검증했는가?</text><text class="foot" x="60" y="666">5단계 · 9 / 9</text></svg>
