<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">대시보드와 알림 소스코드</title><desc id="d">monitoring.py와 report.py의 집계와 payload 생성</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--code:#d9e7f5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:17px}.code{fill:var(--code);font-family:monospace;font-size:17px}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--code:#20344a}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">5단계 · 실습: 관제 소스</text><text class="sub" x="60" y="145">집계 함수와 Critical 필터를 대시보드 payload로 묶는다</text><rect class="panel" x="70" y="220" width="540" height="300" rx="16"/><text class="h" x="100" y="265">05.../src/api.py + store.py + monitoring.py</text><text class="p" x="100" y="315">dashboard_metrics(events)</text><text class="p" x="100" y="355">critical_alert(event)</text><text class="p" x="100" y="395">make_event(...)</text><text class="p" x="100" y="445">by_category · by_risk · blocked_events</text><rect class="panel" x="670" y="220" width="540" height="300" rx="16"/><text class="h" x="700" y="265">05.../src/report.py</text><text class="p" x="700" y="315">dashboard_payload(events)</text><text class="code" x="700" y="365">metrics → dashboard JSON</text><text class="code" x="700" y="405">risk = Critical → alert filter</text><text class="p" x="700" y="430">API: POST /events · GET /metrics · GET /dashboard · GET /alerts/critical</text><text class="p" x="700" y="465">사용 이유: 이벤트를 API·대시보드·알림의 공통 계약으로 사용하기 위해</text><text class="p" x="700" y="500">실습: X-API-Key로 이벤트 등록 후 SQLite·OpenAPI·payload 확인</text><text class="foot" x="60" y="666">5단계 · 5단계 · 3 / 5</text></svg>
