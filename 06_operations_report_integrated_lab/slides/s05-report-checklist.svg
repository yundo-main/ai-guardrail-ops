<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">통합 실습 체크리스트</title><desc id="d">6단계 운영 리포트와 전체 흐름 확인</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#65dfa0}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.p{fill:var(--muted);font-size:19px}.mark{fill:var(--accent);font-size:24px;font-weight:700}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--accent:#16704a}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">6단계 · 복습 체크리스트</text><text class="sub" x="60" y="145">통합 결과를 근거 있는 운영 리포트로 만들었는가</text><rect class="panel" x="80" y="230" width="1120" height="280" rx="16"/><text class="mark" x="120" y="300">✓</text><text class="p" x="165" y="300">탐지·차단율·미대응 이슈를 기간별로 집계한다</text><text class="mark" x="120" y="370">✓</text><text class="p" x="165" y="370">정책 코드부터 알림까지 이벤트 ID로 추적한다</text><text class="mark" x="120" y="440">✓</text><text class="p" x="165" y="440">다음 개선 과제와 측정 기준을 리포트에 남긴다</text><text class="foot" x="60" y="666">6단계 · 6단계 · 5 / 6</text></svg>
