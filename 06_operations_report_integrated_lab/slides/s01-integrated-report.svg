<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">운영 리포트 및 통합 실습</title><desc id="d">정책 실행 결과를 운영 리포트와 개선안으로 연결</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--blue:#173b63;--green:#183d2d;--orange:#3b2b18;--line:#8fa5bd;--accent:#60aef5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:40px;font-weight:700}.sub,.small{fill:var(--muted);font-size:20px}.box{fill:var(--blue);stroke:var(--accent);stroke-width:2}.control{fill:var(--green);stroke:#65dfa0;stroke-width:2}.warn{fill:var(--orange);stroke:#ffc267;stroke-width:2}.txt{fill:var(--ink);font-size:22px;font-weight:700}.line{stroke:var(--line);stroke-width:3}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--blue:#e8f2fb;--green:#e7f6ee;--orange:#fff4df;--accent:#1769aa;--line:#9aabba}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="110">6단계 · 운영 리포트 작성 및 통합 실습</text><text class="sub" x="60" y="150">탐지부터 대응과 개선안까지 하나의 운영 결과로 묶는다</text><g text-anchor="middle"><rect class="box" x="80" y="280" width="230" height="130" rx="16"/><text class="txt" x="195" y="330">실행 결과</text><text class="small" x="195" y="370">허용·차단·검토</text><rect class="control" x="370" y="280" width="230" height="130" rx="16"/><text class="txt" x="485" y="330">운영 지표</text><text class="small" x="485" y="370">탐지·차단율·미대응</text><rect class="control" x="660" y="280" width="230" height="130" rx="16"/><text class="txt" x="775" y="330">주간·월간 리포트</text><text class="small" x="775" y="370">기간별 비교</text><rect class="warn" x="950" y="280" width="230" height="130" rx="16"/><text class="txt" x="1065" y="330">개선안</text><text class="small" x="1065" y="370">정책·탐지·알림 개선</text></g><path class="line" d="M310 345h60M600 345h60M890 345h60"/><text class="foot" x="60" y="666">6단계 · 6단계 · 1 / 5</text></svg>
