<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">운영 리포트 이론</title><desc id="d">주간과 월간 운영 리포트에 포함할 핵심 지표</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--blue:#173b63;--green:#183d2d;--orange:#3b2b18;--accent:#60aef5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.box{fill:var(--blue);stroke:var(--accent);stroke-width:2}.control{fill:var(--green);stroke:#65dfa0;stroke-width:2}.warn{fill:var(--orange);stroke:#ffc267;stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:18px}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--blue:#e8f2fb;--green:#e7f6ee;--orange:#fff4df;--accent:#1769aa}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">6단계 · 이론: 운영 리포트</text><text class="sub" x="60" y="145">수치는 현재 상태와 다음 개선 과제를 함께 보여 줘야 한다</text><text class="sub" x="60" y="185">배경: 가드레일은 반복 측정과 리포트를 통해 계속 개선해야 하는 운영 체계다</text><rect class="box" x="80" y="250" width="330" height="210" rx="16"/><text class="h" x="115" y="300">탐지·방어</text><text class="p" x="115" y="345">탐지 건수</text><text class="p" x="115" y="380">차단 건수·차단율</text><text class="p" x="115" y="415">위험 등급 분포</text><rect class="control" x="475" y="250" width="330" height="210" rx="16"/><text class="h" x="510" y="300">운영 상태</text><text class="p" x="510" y="345">검토 건수</text><text class="p" x="510" y="380">미대응 이슈</text><text class="p" x="510" y="415">정책 변경 전후 비교</text><rect class="warn" x="870" y="250" width="330" height="210" rx="16"/><text class="h" x="905" y="300">개선 계획</text><text class="p" x="905" y="345">원인과 근거</text><text class="p" x="905" y="380">담당자·기한</text><text class="p" x="905" y="415">다음 측정 기준</text><text class="foot" x="60" y="666">6단계 · 6단계 · 2 / 5</text></svg>
