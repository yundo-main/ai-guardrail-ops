<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
<title id="t">6단계 · 실습 순서</title>
<desc id="d">통합 실행·결과 확인·HTML 리포트·선택적 LLM 실습 순서</desc>
<style>
:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#65dfa0;--blue:#60aef5}
*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.bg{fill:var(--bg)}
.title{fill:var(--ink);font-size:38px;font-weight:700}
.sub{fill:var(--muted);font-size:20px}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}
.h{fill:var(--ink);font-weight:700}
.p{fill:var(--muted);font-size:15px}
.p14{fill:var(--muted);font-size:14px}
.code{fill:var(--accent);font-family:Menlo,Consolas,"Courier New",monospace}
.codebox{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.num{fill:var(--ink);font-size:26px;font-weight:700}
.foot{fill:var(--muted);font-size:14px}
@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--accent:#16704a;--blue:#1769aa}}
</style>
<rect class="bg" width="1280" height="720"/>
<text class="title" x="60" y="90">6단계 · 실습 순서</text>
<text class="sub" x="60" y="126">전체 흐름을 통합 실행하고 운영 리포트를 만든다</text>

<rect class="panel" x="60" y="160" width="560" height="470" rx="16"/>
<rect x="60" y="160" width="10" height="470" rx="5" fill="var(--blue)"/>
<text class="h" x="90" y="205" font-size="24">실습 순서</text>

<!-- 행 구조: codebox 카드 안에 원문자 번호(x122) + 라벨(x148 상단) + 코드(x148 하단) -->
<rect class="codebox" x="95" y="225" width="480" height="76" rx="10"/>
<text class="num" x="122" y="263" text-anchor="middle" dominant-baseline="central">①</text>
<text class="p" x="148" y="250" font-size="14">통합 실행 (05 metrics 선행)</text>
<text class="code" x="148" y="276" font-size="12">python 06_operations_report_integrated_lab/src/app.py</text>
<text class="code" x="148" y="294" font-size="11" fill="var(--muted)"># → results/step06-report.json + .html 생성</text>

<rect class="codebox" x="95" y="315" width="480" height="76" rx="10"/>
<text class="num" x="122" y="353" text-anchor="middle" dominant-baseline="central">②</text>
<text class="p" x="148" y="340" font-size="14">결과 JSON 확인</text>
<text class="code" x="148" y="366" font-size="12">cd 06_operations_report_integrated_lab</text>
<text class="code" x="148" y="384" font-size="12">python -m json.tool results/step06-report.json</text>

<rect class="codebox" x="95" y="405" width="480" height="76" rx="10"/>
<text class="num" x="122" y="443" text-anchor="middle" dominant-baseline="central">③</text>
<text class="p" x="148" y="430" font-size="14">HTML 리포트 확인</text>
<text class="code" x="148" y="456" font-size="12">cd 06_operations_report_integrated_lab</text>
<text class="code" x="148" y="474" font-size="12">open results/step06-report.html</text>

<rect class="codebox" x="95" y="495" width="480" height="76" rx="10"/>
<text class="num" x="122" y="533" text-anchor="middle" dominant-baseline="central">④</text>
<text class="p" x="148" y="520" font-size="14">LLM 응답 (선택)</text>
<text class="code" x="148" y="546" font-size="12">USE_LLM=1 python src/app.py</text>
<text class="code" x="148" y="564" font-size="11" fill="var(--muted)"># 06 폴더에서 · Ollama 서버 실행 필요</text>

<rect class="panel" x="660" y="160" width="560" height="470" rx="16"/>
<rect x="660" y="160" width="10" height="470" rx="5" fill="var(--accent)"/>
<text class="h" x="690" y="205" font-size="24">산출물 · 주의</text>

<text class="num" x="690" y="250" font-size="20" dominant-baseline="central">•</text>
<text class="p" x="715" y="244" font-size="15">선행 조건: 05의 step05-metrics.json</text>
<text class="p14" x="715" y="266" font-size="13">없으면 upstream_metrics가 비어 있음</text>

<text class="num" x="690" y="316" font-size="20" dominant-baseline="central">•</text>
<text class="p" x="715" y="310" font-size="15">산출물: step06-report.json + .html</text>
<text class="p14" x="715" y="332" font-size="13">results/ 아래 생성 · HTML은 브라우저로 확인</text>

<text class="num" x="690" y="382" font-size="20" dominant-baseline="central">•</text>
<text class="p" x="715" y="376" font-size="15">USE_LLM=1이어도 실패 시</text>
<text class="p14" x="715" y="398" font-size="13">결정론적 fixture로 폴백 — 실행은 계속됨</text>

<text class="num" x="690" y="448" font-size="20" dominant-baseline="central">•</text>
<text class="p" x="715" y="442" font-size="15">LLM 없이도 기본 실행 가능</text>
<text class="p14" x="715" y="464" font-size="13">더미 응답으로 전체 흐름을 먼저 검증</text>

<text class="p14" x="715" y="540" font-size="13">실행 위치: 저장소 루트(ai-guardrails-ops/)</text>
<text class="p14" x="715" y="562" font-size="13">테스트: python -m unittest discover -s tests -v</text>
<text class="p14" x="715" y="584" font-size="13">※ 다른 단계 폴더를 참조하지 않는 독립 구조</text>

<text class="foot" x="60" y="705">6단계 · 실습 순서 · 4 / 8</text>
</svg>
