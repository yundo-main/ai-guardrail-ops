<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
  <title id="t">6단계 · 실습 순서</title>
  <desc id="d">06단계 실습을 순서대로 실행하는 단계별 명령 안내</desc>
  <style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#65dfa0}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.p{fill:var(--muted);font-size:19px}.mark{fill:var(--accent);font-size:24px;font-weight:700}.foot{fill:var(--muted);font-size:14px}.h{fill:var(--ink);font-weight:700}.code{fill:var(--accent);font-family:Menlo,Consolas,"Courier New",monospace}.codebox{fill:var(--bg);stroke:var(--line);stroke-width:1.5}.arrow{stroke:var(--accent);stroke-width:3;fill:none}.mk{fill:var(--accent)}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--accent:#16704a}}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="60" y="90">6단계 · 실습 순서</text>
  <text class="sub" x="60" y="126">전체 흐름을 통합 실행하고 운영 리포트를 만든다</text>

  <rect class="panel" x="60" y="160" width="560" height="334" rx="16"/>
  <text class="h" font-size="24" x="90" y="205">실습 순서</text>
    <rect class="codebox" x="95" y="225" width="480" height="56" rx="10"/>
    <circle cx="122" cy="253" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="258" font-size="14" text-anchor="middle">1</text>
    <text class="p" x="148" y="247" font-size="14">통합 실행 (05 metrics 선행)</text>
    <text class="code" x="148" y="268" font-size="12">python3 06_operations_report_integrated_lab/src/app.py</text>
    <path class="arrow" d="M340 281 V289"/>
    <rect class="codebox" x="95" y="295" width="480" height="56" rx="10"/>
    <circle cx="122" cy="323" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="328" font-size="14" text-anchor="middle">2</text>
    <text class="p" x="148" y="317" font-size="14">결과 확인</text>
    <text class="code" x="148" y="338" font-size="12">python3 -m json.tool 06_operations_report_integrated_lab/results/step06-report.json</text>
    <path class="arrow" d="M340 351 V359"/>
    <rect class="codebox" x="95" y="365" width="480" height="56" rx="10"/>
    <circle cx="122" cy="393" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="398" font-size="14" text-anchor="middle">3</text>
    <text class="p" x="148" y="387" font-size="14">HTML 리포트 확인</text>
    <text class="code" x="148" y="408" font-size="12">open 06_operations_report_integrated_lab/results/step06-report.html</text>
    <path class="arrow" d="M340 421 V429"/>
    <rect class="codebox" x="95" y="435" width="480" height="56" rx="10"/>
    <circle cx="122" cy="463" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="468" font-size="14" text-anchor="middle">4</text>
    <text class="p" x="148" y="457" font-size="14">LLM 응답 (선택)</text>
    <text class="code" x="148" y="478" font-size="12">USE_LLM=1 + Ollama 실행 → 실제 모델 응답 경로</text>

  <rect class="panel" x="660" y="160" width="560" height="334" rx="16"/>
  <text class="h" font-size="24" x="690" y="205">산출물 · 주의</text>
    <text class="p" x="700" y="250" font-size="15">• 선행 조건: 05의 step05-metrics.json — 없으면 upstream_metrics 비어 있음</text>
    <text class="p" x="700" y="284" font-size="15">• 산출물: step06-report.json + .html</text>
    <text class="p" x="700" y="318" font-size="15">• USE_LLM=1이어도 실패 시 결정론적 폴백</text>

  <text class="foot" x="60" y="705">6단계 · 실습 순서 · 4 / 6</text>
</svg>
