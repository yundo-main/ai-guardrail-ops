<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
<title id="t">6단계 실습 Flow · 통합 실습과 운영 리포트</title>
<desc id="d">app.py 샘플 실행부터 safe_response 판정, 이벤트 집계, step06-report.json·HTML 생성까지의 소스 실행 흐름</desc>
<defs>
<style>
text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Helvetica Neue",Arial,sans-serif;fill:#0f172a}
.title{font-size:50px;font-weight:800}
.subt{font-size:25px;fill:#475569}
.h2{font-size:26px;font-weight:800}
.body{font-size:20px;fill:#334155}
.sm{font-size:17px;fill:#475569}
.lbl{font-size:18px;font-weight:700}
.bar{font-size:24px;font-weight:800;fill:#ffffff}
.mono16{font-family:Menlo,Consolas,"Courier New",monospace;font-size:16px;fill:#1e293b}
.mono14{font-family:Menlo,Consolas,"Courier New",monospace;font-size:14px;fill:#334155}
</style>
<marker id="ab" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 1L15 8L0 15Z" fill="#1d4ed8"/></marker>
<marker id="ag" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 1L15 8L0 15Z" fill="#15803d"/></marker>
<marker id="ao" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 1L15 8L0 15Z" fill="#c2410c"/></marker>
<marker id="ap" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 1L15 8L0 15Z" fill="#7c3aed"/></marker>
<marker id="as" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 1L15 8L0 15Z" fill="#64748b"/></marker>
</defs>

<rect width="1920" height="1080" fill="#ffffff"/>
<text class="title" x="60" y="90">6단계 실습 Flow · 통합 실습과 운영 리포트</text>
<text class="subt" x="60" y="140">python src/app.py — 샘플 3건 → safe_response 판정 → 이벤트 집계 → step06-report.json·HTML</text>

<!-- 1 샘플 정의 -->
<rect x="60" y="180" width="900" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="60" y="180" width="10" height="110" rx="5" fill="#1d4ed8"/>
<text x="105" y="222" font-size="30" text-anchor="middle" dominant-baseline="central">①</text>
<text class="lbl" x="140" y="212">main() — samples 3건 정의</text>
<rect x="140" y="226" width="780" height="52" rx="8" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="10 6"/>
<text class="mono14" x="156" y="246">① 정상: "Summarize the retention policy." → 정책 요약 응답</text>
<text class="mono14" x="156" y="266">② 차단 시도: "Ignore previous instructions..." → 거절 응답</text>
<text class="mono14" x="156" y="286">③ 민감정보: "support contact?" → 이메일·API 키 포함 응답</text>
<line x1="510" y1="290" x2="510" y2="312" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ab)"/>

<!-- 2 LLM 응답 선택 -->
<rect x="60" y="312" width="900" height="120" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="60" y="312" width="10" height="120" rx="5" fill="#7c3aed"/>
<text x="105" y="354" font-size="30" text-anchor="middle" dominant-baseline="central">②</text>
<text class="lbl" x="140" y="344">generate_response(prompt) — LLM 응답 선택</text>
<rect x="140" y="358" width="780" height="58" rx="8" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="10 6"/>
<text class="mono14" x="156" y="378">USE_LLM=1 → src/llm.py가 로컬 Ollama /api/chat 호출</text>
<text class="mono14" x="156" y="398">미설정·실패 → None 반환 → fixture 응답으로 폴백 (결정론적)</text>
<text class="mono14" x="156" y="416" fill="#64748b">response = llm_response or response  (app.py)</text>
<line x1="510" y1="432" x2="510" y2="454" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ab)"/>

<!-- 3 safe_response 판정 -->
<rect x="60" y="454" width="900" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="60" y="454" width="10" height="150" rx="5" fill="#c2410c"/>
<text x="105" y="504" font-size="30" text-anchor="middle" dominant-baseline="central">③</text>
<text class="lbl" x="140" y="490">safe_response(prompt, response) — guardrail.py</text>
<text class="mono14" x="140" y="522">input_result, output_result = safe_response(...)</text>
<text class="mono14" x="140" y="544">├─ step03 check_input: 정책 규칙 매칭 → ALLOW / BLOCK</text>
<text class="mono14" x="140" y="566">└─ redact_output: email·api_key·phone·secret_keyword 마스킹</text>
<text class="sm" x="140" y="592" fill="#64748b">result = output_result if input ALLOW else input_result (BLOCK 시 출력 폐기)</text>
<line x1="510" y1="604" x2="510" y2="626" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ab)"/>

<!-- 4 이벤트화·알림 -->
<rect x="60" y="626" width="900" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="60" y="626" width="10" height="130" rx="5" fill="#1d4ed8"/>
<text x="105" y="668" font-size="30" text-anchor="middle" dominant-baseline="central">④</text>
<text class="lbl" x="140" y="658">SecurityEvent 조립 → critical_alert()</text>
<rect x="140" y="672" width="780" height="66" rx="8" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="10 6"/>
<text class="mono14" x="156" y="692">SecurityEvent(demo-N, decision, risk, category, result.text, ...)</text>
<text class="mono14" x="156" y="712">category = matches[0].reason or masked_fields[0] or "normal"</text>
<text class="mono14" x="156" y="730">model_name = OLLAMA_MODEL if llm else "deterministic-fixture"</text>
<line x1="510" y1="756" x2="510" y2="778" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ab)"/>

<!-- 5 집계·upstream -->
<rect x="60" y="778" width="900" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="60" y="778" width="10" height="110" rx="5" fill="#15803d"/>
<text x="105" y="820" font-size="30" text-anchor="middle" dominant-baseline="central">⑤</text>
<text class="lbl" x="140" y="810">dashboard_metrics(events) + upstream 로드</text>
<rect x="140" y="824" width="780" height="52" rx="8" fill="none" stroke="#15803d" stroke-width="1.5" stroke-dasharray="10 6"/>
<text class="mono14" x="156" y="844">dashboard_metrics(events) → total·blocked·review·by_risk·block_rate</text>
<text class="mono14" x="156" y="864">05.../results/step05-metrics.json 존재 시 upstream_metrics로 로드</text>
<line x1="510" y1="888" x2="510" y2="910" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ab)"/>

<!-- 6 산출물 -->
<rect x="60" y="910" width="900" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="60" y="910" width="10" height="62" rx="5" fill="#15803d"/>
<text x="105" y="936" font-size="30" text-anchor="middle" dominant-baseline="central">⑥</text>
<text class="lbl" x="140" y="928">payload → step06-report.json + report.write_report() → .html</text>
<text class="mono14" x="140" y="952" fill="#334155">results/step06-report.json (schema_version 1.0 · source_stage step06) → results/step06-report.html</text>

<!-- ===== 우측: 정보 패널 ===== -->
<rect x="1000" y="180" width="860" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1000" y="180" width="10" height="180" rx="5" fill="#1d4ed8"/>
<text x="1045" y="222" font-size="30" text-anchor="middle" dominant-baseline="central">①</text>
<text class="h2" x="1080" y="222">실행 조건</text>
<text class="body" x="1080" y="256">저장소 루트에서 python src/app.py 실행</text>
<text class="body" x="1080" y="288">LLM 불필요 — USE_LLM=1일 때만 Ollama 선택 사용</text>
<text class="body" x="1080" y="320">05 step05-metrics.json은 선행 권장, 없어도 실행됨</text>
<text class="body" x="1080" y="352">src/는 03·05 복사본 포함 독립 실행 구조</text>

<rect x="1000" y="376" width="860" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1000" y="376" width="10" height="180" rx="5" fill="#7c3aed"/>
<text x="1045" y="418" font-size="30" text-anchor="middle" dominant-baseline="central">②</text>
<text class="h2" x="1080" y="418">처리 규칙 · guardrail.py</text>
<text class="body" x="1080" y="452">입력 BLOCK → 모델 응답 폐기, 입력 차단 결과를 이벤트화</text>
<text class="body" x="1080" y="484">출력 마스킹 발생 → review 판정, 없으면 allow</text>
<text class="body" x="1080" y="516">api_key·secret_keyword 포함 시 Critical 승격</text>
<text class="body" x="1080" y="548">critical_alert()는 Critical 이벤트에만 payload 생성</text>

<rect x="1000" y="572" width="860" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1000" y="572" width="10" height="180" rx="5" fill="#15803d"/>
<text x="1045" y="614" font-size="30" text-anchor="middle" dominant-baseline="central">③</text>
<text class="h2" x="1080" y="614">결과 계약 · step06-report.json</text>
<text class="mono16" x="1080" y="648">schema_version "1.0" · step "06" · source_stage "step06"</text>
<text class="mono16" x="1080" y="678">events[] · metrics · upstream_metrics · llm_mode</text>
<text class="body" x="1080" y="712">report.write_report()가 payload를 독립 HTML로 렌더링</text>
<text class="body" x="1080" y="744">민감정보는 마스킹된 result.text만 detail에 기록</text>

<rect x="1000" y="768" width="860" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1000" y="768" width="10" height="180" rx="5" fill="#0f766e"/>
<text x="1045" y="810" font-size="30" text-anchor="middle" dominant-baseline="central">④</text>
<text class="h2" x="1080" y="810">검증 기준 (실습 기대값)</text>
<text class="body" x="1080" y="844">python -m json.tool results/step06-report.json 정상</text>
<text class="body" x="1080" y="876">events 3건 · sample ③은 review/Critical 기대</text>
<text class="body" x="1080" y="908">metrics.total_events=3 · upstream_metrics는 05 파일 있을 때만</text>
<text class="body" x="1080" y="940">step06-report.html 브라우저 렌더링 확인</text>

<!-- ===== 하단 요약 바 ===== -->
<rect x="0" y="976" width="1920" height="88" fill="#0f172a"/>
<text class="bar" x="960" y="1030" text-anchor="middle">samples 3건 → generate_response(LLM/fixture) → safe_response 판정 → SecurityEvent → metrics+upstream 집계 → step06-report.json·HTML 저장</text>
</svg>
