<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">통합 실습 소스코드</title><desc id="d">app.py가 가드레일, 이벤트, 관제 결과를 통합 실행하는 흐름</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--code:#d9e7f5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:17px}.code{fill:var(--code);font-family:monospace;font-size:17px}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--code:#20344a}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">6단계 · 실습: 통합 실행</text><text class="sub" x="60" y="145">단계별 모듈을 app.py에서 연결해 운영 결과를 만든다</text><rect class="panel" x="70" y="220" width="540" height="300" rx="16"/><text class="h" x="100" y="265">06.../src/app.py</text><text class="p" x="100" y="315">safe_response(prompt, response)</text><text class="p" x="100" y="355">SecurityEvent 생성</text><text class="p" x="100" y="395">critical_alert(event)</text><text class="p" x="100" y="435">dashboard_metrics(events)</text><rect class="panel" x="670" y="220" width="540" height="300" rx="16"/><text class="h" x="700" y="265">통합 실행</text><text class="code" x="700" y="325">python3 06_operations_report_integrated_lab/</text><text class="code" x="700" y="355">src/app.py</text><text class="p" x="700" y="415">입력 판정 → 출력 마스킹 → 이벤트 → 알림</text><text class="p" x="700" y="445">llm.py: 선택적 Ollama 로컬 모델 호출</text><text class="p" x="700" y="480">사용 이유: 모델·더미 응답을 동일한 통제 흐름으로 검증하기 위해</text><text class="p" x="700" y="510">USE_LLM=1 → 모델 응답 → safe_response() → 운영 지표 JSON</text><text class="foot" x="60" y="666">6단계 · 6단계 · 3 / 8</text></svg>
