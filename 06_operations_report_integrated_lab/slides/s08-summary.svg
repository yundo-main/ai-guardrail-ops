<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">통합 실습 요약</title><desc id="d">6단계 전체 흐름과 운영 리포트 질문</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#ffc267}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:19px}.accent{fill:var(--accent);font-size:19px;font-weight:700}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">6단계 · 핵심 요약과 실습 질문</text><text class="sub" x="60" y="145">모델 응답부터 운영 리포트까지 하나의 증거 흐름으로 연결한다</text><rect class="panel" x="80" y="230" width="520" height="280" rx="16"/><text class="h" x="115" y="280">핵심 메시지</text><text class="p" x="115" y="330">모델 응답도 반드시 동일한 가드레일을 통과한다</text><text class="p" x="115" y="370">이벤트 ID와 지표 정의로 추적성을 유지한다</text><text class="p" x="115" y="410">리포트는 다음 개선 과제로 이어져야 한다</text><rect class="panel" x="660" y="230" width="540" height="280" rx="16"/><text class="h" x="695" y="280">실습 질문</text><text class="accent" x="695" y="330">LLM 응답과 더미 응답의 차이는 무엇인가?</text><text class="accent" x="695" y="370">차단율·미대응 이슈를 기간별 비교했는가?</text><text class="accent" x="695" y="410">다음 정책 개선의 측정 기준은 무엇인가?</text><text class="foot" x="60" y="666">6단계 · 8 / 8</text></svg>
