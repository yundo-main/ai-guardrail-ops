<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">Guardrail 위협과 통제</title><desc id="d">입력과 출력에서 발생하는 대표 위협과 통제 위치</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--blue:#173b63;--green:#183d2d;--orange:#3b2b18;--accent:#60aef5;--line:#8fa5bd}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.box{fill:var(--blue);stroke:var(--accent);stroke-width:2}.control{fill:var(--green);stroke:#65dfa0;stroke-width:2}.warn{fill:var(--orange);stroke:#ffc267;stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:18px}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--blue:#e8f2fb;--green:#e7f6ee;--orange:#fff4df;--accent:#1769aa;--line:#9aabba}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">1단계 · 이론: 위협과 통제 지점</text><text class="sub" x="60" y="145">가드레일은 모델의 앞과 뒤에서 서로 다른 위험을 검사한다</text><rect class="warn" x="80" y="250" width="300" height="190" rx="16"/><text class="h" x="110" y="300">입력 단계 위협</text><text class="p" x="110" y="340">프롬프트 인젝션</text><text class="p" x="110" y="370">유해 요청·도구 남용</text><text class="p" x="110" y="400">비밀정보 탈취 요청</text><rect class="control" x="490" y="250" width="300" height="190" rx="16"/><text class="h" x="520" y="300">입력 가드레일</text><text class="p" x="520" y="340">정책 규칙 검사</text><text class="p" x="520" y="370">허용·차단·검토 판정</text><text class="p" x="520" y="400">차단 사유와 위험 등급 기록</text><rect class="box" x="900" y="250" width="300" height="190" rx="16"/><text class="h" x="930" y="300">출력 가드레일</text><text class="p" x="930" y="340">PII·API 키 탐지</text><text class="p" x="930" y="370">마스킹·재생성·검토</text><text class="p" x="930" y="400">이벤트와 리포트 연결</text><text class="foot" x="60" y="666">1단계 · 1단계 · 3 / 6</text></svg>
