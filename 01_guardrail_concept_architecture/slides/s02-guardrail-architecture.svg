<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">Guardrail 아키텍처</title><desc id="d">입력, Guardrail, 모델, 출력 검열과 관제의 기본 구조</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--blue:#173b63;--green:#183d2d;--orange:#3b2b18;--line:#8fa5bd;--accent:#60aef5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:40px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.box{fill:var(--blue);stroke:var(--accent);stroke-width:2}.control{fill:var(--green);stroke:#65dfa0;stroke-width:2}.txt{fill:var(--ink);font-size:22px;font-weight:700}.small{fill:var(--muted);font-size:17px}.line{stroke:var(--line);stroke-width:3}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--blue:#e8f2fb;--green:#e7f6ee;--accent:#1769aa;--line:#9aabba}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="110">1단계 · Guardrail 개념과 아키텍처</text><text class="sub" x="60" y="150">모델 호출 전후에 통제 지점을 배치한다</text><text class="sub" x="60" y="190">배경: 모델은 정책을 항상 일관되게 지키지 않으므로 전후 통제가 필요하다</text><g text-anchor="middle"><rect class="box" x="80" y="280" width="190" height="120" rx="16"/><text class="txt" x="175" y="330">사용자 입력</text><text class="small" x="175" y="362">prompt</text><rect class="control" x="350" y="280" width="190" height="120" rx="16"/><text class="txt" x="445" y="330">입력 가드레일</text><text class="small" x="445" y="362">allow / block / review</text><rect class="box" x="620" y="280" width="190" height="120" rx="16"/><text class="txt" x="715" y="330">LLM</text><text class="small" x="715" y="362">model response</text><rect class="control" x="890" y="280" width="190" height="120" rx="16"/><text class="txt" x="985" y="330">출력 검열</text><text class="small" x="985" y="362">PII / secret mask</text></g><path class="line" d="M270 340h80M540 340h80M810 340h80"/><text class="foot" x="60" y="666">1단계 · 2 / 7</text></svg>
