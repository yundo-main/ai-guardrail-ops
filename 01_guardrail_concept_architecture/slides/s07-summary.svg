<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">Guardrail 아키텍처 요약</title><desc id="d">1단계 핵심 개념과 실습 확인 질문</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#ffc267}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:19px}.accent{fill:var(--accent);font-size:19px;font-weight:700}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">1단계 · 핵심 요약과 실습 질문</text><text class="sub" x="60" y="145">통제 지점을 설명할 수 있으면 1단계를 완료한 것이다</text><rect class="panel" x="80" y="230" width="520" height="280" rx="16"/><text class="h" x="115" y="280">핵심 메시지</text><text class="p" x="115" y="330">입력과 출력은 서로 다른 위험을 가진다</text><text class="p" x="115" y="370">모델 호출 전후에 독립적인 통제를 둔다</text><text class="p" x="115" y="410">판정 결과는 이벤트와 대응으로 연결한다</text><rect class="panel" x="660" y="230" width="540" height="280" rx="16"/><text class="h" x="695" y="280">실습 질문</text><text class="accent" x="695" y="330">어떤 입력을 차단할 것인가?</text><text class="accent" x="695" y="370">어떤 출력은 마스킹해야 하는가?</text><text class="accent" x="695" y="410">실패 시 안전한 기본값은 무엇인가?</text><text class="foot" x="60" y="666">1단계 · 7 / 7</text></svg>
