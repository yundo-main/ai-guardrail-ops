<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">Guardrail 아키텍처 소스코드</title><desc id="d">architecture.py가 파이프라인 위치를 정의하고 run_pipeline이 최소 실행을 재현하는 과정</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--code:#d9e7f5;--accent:#60aef5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:17px}.code{fill:var(--code);font-family:monospace;font-size:17px}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--code:#20344a}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">1단계 · 실습: 아키텍처 소스</text><text class="sub" x="60" y="145">설계 단계와 최소 실행 파이프라인을 같은 코드에서 확인한다</text><rect class="panel" x="70" y="220" width="540" height="300" rx="16"/><text class="h" x="100" y="265">파일과 핵심 요소</text><text class="p" x="100" y="310">01.../src/architecture.py</text><text class="p" x="100" y="350">PipelineStage · DEFAULT_PIPELINE</text><text class="p" x="100" y="390">pipeline_summary()</text><text class="p" x="100" y="430">run_pipeline(prompt, model)</text><text class="p" x="100" y="475">PipelineResult</text><rect class="panel" x="670" y="220" width="540" height="300" rx="16"/><text class="h" x="700" y="265">실행과 결과</text><text class="code" x="700" y="325">python 01_guardrail_concept_architecture/</text><text class="code" x="700" y="355">src/architecture.py</text><text class="code" x="700" y="405">입력 → 더미 모델 → 출력 → 관제</text><text class="p" x="700" y="450">정상 입력: allow</text><text class="p" x="700" y="480">빈 입력: block · 빈 응답: review</text><text class="p" x="700" y="510">02단계부터 모델·정책 구현으로 교체</text><text class="foot" x="60" y="666">1단계 · 4 / 7</text></svg>
