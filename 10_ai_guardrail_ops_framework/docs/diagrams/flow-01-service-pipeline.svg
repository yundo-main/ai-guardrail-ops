<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 460" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .boxR{rx:12}
      .t{font-size:12.5px;font-weight:700;fill:#122033}
      .s{font-size:10px;fill:#516174}
      .edge{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arr)}
      .edgeB{stroke:#1769aa;stroke-width:2;fill:none;marker-end:url(#arrB)}
      .edgeP{stroke:#7c3aed;stroke-width:1.6;fill:none;marker-end:url(#arrP)}
      .lane{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.2}
      .laneR{rx:14}
      .laneT{font-size:11.5px;font-weight:700;fill:#1769aa}
      .num{font-size:14px;font-weight:800}
      .n1{fill:#1e3a8a}.n2{fill:#6d28d9}.n3{fill:#0f766e}.n4{fill:#b45309}.n5{fill:#be123c}
      .chip{fill:#eef4fb;stroke:#bcd3ea;stroke-width:1}
      .chipT{font-size:9.5px;font-weight:600;fill:#1e4e79}
      .indep{stroke:#94a3b8;stroke-dasharray:6,4}
      .og{fill:#166534}.oy{fill:#92400e}.or{fill:#991b1b}
    </style>
  </defs>

  <!-- ===== main horizontal pipeline ===== -->
  <!-- user -->
  <rect class="box boxR" x="15" y="180" width="105" height="70"/>
  <text class="t" x="67" y="210" text-anchor="middle" style="font-size:12px">사용자</text>
  <text class="s" x="67" y="228" text-anchor="middle">브라우저</text>

  <!-- pages -->
  <rect class="box boxR" x="160" y="120" width="160" height="190"/>
  <text class="t" x="240" y="144" text-anchor="middle">페이지</text>
  <rect class="chip" x="172" y="158" width="136" height="30" rx="7"/>
  <text class="chipT" x="240" y="177" text-anchor="middle">/ 랜딩 — 소개·흐름도</text>
  <rect class="chip" x="172" y="196" width="136" height="30" rx="7"/>
  <text class="chipT" x="240" y="215" text-anchor="middle">/ops 운영 — 전체 API</text>
  <rect class="chip" x="172" y="234" width="136" height="30" rx="7"/>
  <text class="chipT" x="240" y="253" text-anchor="middle">/chat 챗봇 — check만</text>
  <rect class="chip indep" x="172" y="272" width="136" height="30" rx="7"/>
  <text class="chipT" x="240" y="291" text-anchor="middle" style="fill:#64748b">chatbot/ 독립 앱</text>

  <!-- http gateway -->
  <rect class="box boxR" x="360" y="140" width="180" height="150" style="stroke:#1769aa;stroke-width:2"/>
  <text class="t" x="450" y="164" text-anchor="middle">serve/http.py</text>
  <text class="s" x="450" y="180" text-anchor="middle">API 단일 관문</text>
  <rect class="chip" x="372" y="192" width="156" height="24" rx="6"/>
  <text class="chipT" x="450" y="208" text-anchor="middle">POST /v1/check</text>
  <rect class="chip" x="372" y="222" width="156" height="24" rx="6"/>
  <text class="chipT" x="450" y="238" text-anchor="middle">GET /events·/policy…</text>
  <rect class="chip" x="372" y="252" width="156" height="24" rx="6"/>
  <text class="chipT" x="450" y="268" text-anchor="middle">POST /settings·/ack…</text>
  <text class="s" x="450" y="286" text-anchor="middle" style="fill:#991b1b">rate limit · 1MB cap</text>

  <!-- guardrail lane containing 5 stages -->
  <rect class="lane laneR" x="580" y="40" width="560" height="360"/>
  <text class="laneT" x="600" y="64">guardrail/ — 판정 파이프라인 (Pipeline.run)</text>

  <!-- stage cards inside lane: 5 across? width 560/5=112 too small. Use 2 rows: 3 top + 2 bottom? Better: horizontal mini chain of 5 with w=100 each: 5*104+4*8=552 fits -->
  <rect class="box boxR" x="595" y="90" width="100" height="120"/>
  <text class="num n1" x="645" y="112" text-anchor="middle">①</text>
  <text class="t" x="645" y="132" text-anchor="middle" style="font-size:11px">입력 정책</text>
  <text class="s" x="645" y="148" text-anchor="middle">policy.py</text>
  <text class="s" x="645" y="162" text-anchor="middle">규칙 17개</text>
  <rect x="605" y="176" width="80" height="20" rx="5" fill="#fee2e2"/>
  <text class="s" x="645" y="190" text-anchor="middle" style="fill:#991b1b;font-size:9px;font-weight:700">block→종료</text>

  <rect class="box boxR" x="703" y="90" width="100" height="120"/>
  <text class="num n2" x="753" y="112" text-anchor="middle">②</text>
  <text class="t" x="753" y="132" text-anchor="middle" style="font-size:11px">대화 레일</text>
  <text class="s" x="753" y="148" text-anchor="middle">dialogue.py</text>
  <text class="s" x="753" y="162" text-anchor="middle">--rail (선택)</text>
  <rect x="713" y="176" width="80" height="20" rx="5" fill="#fef3c7"/>
  <text class="s" x="753" y="190" text-anchor="middle" style="fill:#92400e;font-size:9px;font-weight:700">이탈→REVIEW</text>

  <rect class="box boxR" x="811" y="90" width="100" height="120"/>
  <text class="num n3" x="861" y="112" text-anchor="middle">③</text>
  <text class="t" x="861" y="132" text-anchor="middle" style="font-size:11px">LLM 모델</text>
  <text class="s" x="861" y="148" text-anchor="middle">model.py</text>
  <text class="s" x="861" y="162" text-anchor="middle">ollama/deepseek</text>
  <rect x="821" y="176" width="80" height="20" rx="5" fill="#dcfce7"/>
  <text class="s" x="861" y="190" text-anchor="middle" style="fill:#166534;font-size:9px;font-weight:700">응답 생성</text>

  <rect class="box boxR" x="919" y="90" width="100" height="120"/>
  <text class="num n4" x="969" y="112" text-anchor="middle">④</text>
  <text class="t" x="969" y="132" text-anchor="middle" style="font-size:11px">분류기</text>
  <text class="s" x="969" y="148" text-anchor="middle">classifier.py</text>
  <text class="s" x="969" y="162" text-anchor="middle">Llama Guard</text>
  <rect x="929" y="176" width="80" height="20" rx="5" fill="#fee2e2"/>
  <text class="s" x="969" y="190" text-anchor="middle" style="fill:#991b1b;font-size:9px;font-weight:700">unsafe→BLOCK</text>

  <rect class="box boxR" x="1027" y="90" width="100" height="120"/>
  <text class="num n5" x="1077" y="112" text-anchor="middle">⑤</text>
  <text class="t" x="1077" y="132" text-anchor="middle" style="font-size:11px">출력 마스킹</text>
  <text class="s" x="1077" y="148" text-anchor="middle">output.py</text>
  <text class="s" x="1077" y="162" text-anchor="middle">패턴 4종</text>
  <rect x="1037" y="176" width="80" height="20" rx="5" fill="#dcfce7"/>
  <text class="s" x="1077" y="190" text-anchor="middle" style="fill:#166534;font-size:9px;font-weight:700">email·key 검열</text>

  <!-- intra-pipeline edges -->
  <path class="edge" d="M695,150 L703,150"/>
  <path class="edge" d="M803,150 L811,150"/>
  <path class="edge" d="M911,150 L919,150"/>
  <path class="edge" d="M1019,150 L1027,150"/>

  <!-- decision chips row inside lane -->
  <rect x="595" y="240" width="532" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text class="t" x="861" y="262" text-anchor="middle" style="font-size:11px">최종 판정 — decision: allow / review / block · risk: Low~Critical</text>
  <text class="s" x="861" y="279" text-anchor="middle">모든 결과는 RunRecord + SecurityEvent로 변환 · span별 단계 지연 기록 · 조기 종료 시 이후 단계 skipped</text>

  <!-- external LLM feeding stage 3 -->
  <rect class="box boxR" x="811" y="420" width="180" height="34" style="stroke:#7c3aed;stroke-width:2"/>
  <text class="t" x="901" y="442" text-anchor="middle" style="font-size:11px">외부 LLM — Ollama · DeepSeek</text>
  <path class="edgeP" d="M901,420 L901,390 L861,390 L861,210"/>
  <text class="s" x="935" y="350" text-anchor="middle" style="fill:#7c3aed">모델 호출 (실패→에러 응답)</text>

  <!-- ===== right side: results / observe ===== -->
  <rect class="lane laneR" x="1180" y="40" width="0" height="0" fill="none" stroke="none"/>
  <rect class="box boxR" x="1180" y="100" width="0" height="0" fill="none" stroke="none"/>

  <!-- result -> observe lane (placed right of guardrail, may exceed viewBox; extend viewBox handled at 1240 — tight. Instead put observe BELOW guardrail lane) -->

  <!-- edges user->pages->http->pipeline -->
  <path class="edgeB" d="M120,215 L160,215"/>
  <path class="edgeB" d="M320,215 L360,215"/>
  <path class="edgeB" d="M540,215 L580,215"/>

  <!-- pipeline -> result already inside lane; lane -> observe below -->
  <rect class="lane laneR" x="580" y="430" width="560" height="0" fill="none" stroke="none"/>

  <!-- observe lane full width bottom -->
  <rect class="lane laneR" x="15" y="330" width="700" height="120"/>
  <text class="laneT" x="35" y="354">guardrail-ops/observe — 관측·저장·리포트</text>

  <rect class="box" x="35" y="368" width="155" height="64" rx="9"/>
  <text class="t" x="112" y="392" text-anchor="middle" style="font-size:11px">store.py</text>
  <text class="s" x="112" y="410" text-anchor="middle">events.db + audit</text>
  <text class="s" x="112" y="425" text-anchor="middle">SQLite</text>

  <rect class="box" x="205" y="368" width="155" height="64" rx="9"/>
  <text class="t" x="282" y="392" text-anchor="middle" style="font-size:11px">metrics.py</text>
  <text class="s" x="282" y="410" text-anchor="middle">alerts.jsonl</text>
  <text class="s" x="282" y="425" text-anchor="middle">집계·지연</text>

  <rect class="box" x="375" y="368" width="155" height="64" rx="9"/>
  <text class="t" x="452" y="392" text-anchor="middle" style="font-size:11px">report.py</text>
  <text class="s" x="452" y="410" text-anchor="middle">주간/월간 리포트</text>
  <text class="s" x="452" y="425" text-anchor="middle">GET /report</text>

  <rect class="box" x="545" y="368" width="155" height="64" rx="9"/>
  <text class="t" x="622" y="392" text-anchor="middle" style="font-size:11px">runtime.py</text>
  <text class="s" x="622" y="410" text-anchor="middle">.env 영속화</text>
  <text class="s" x="622" y="425" text-anchor="middle">/settings 저장</text>

  <!-- edge pipeline result -> observe -->
  <path class="edge" d="M861,286 C861,310 700,320 700,368"/>
  <path class="edge" d="M600,286 C500,310 300,320 300,368"/>
  <text class="s" x="640" y="318" text-anchor="middle">RunRecord · SecurityEvent 저장</text>

  <!-- legend -->
  <text class="s" x="15" y="478">굵은 파랑 = 페이지→API · 보라 = 외부 LLM 호출 · 점선 = 독립/미연결 · 모든 쓰기 요청은 serve/http.py 단일 관문 통과</text>
</svg>
