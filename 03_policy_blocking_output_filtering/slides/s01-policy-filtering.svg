<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">정책 기반 차단 및 출력 검열</title><desc id="d">입력 정책 판정과 출력 민감정보 마스킹 흐름</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--blue:#173b63;--green:#183d2d;--orange:#3b2b18;--line:#8fa5bd;--accent:#60aef5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:40px;font-weight:700}.sub,.small{fill:var(--muted);font-size:20px}.box{fill:var(--blue);stroke:var(--accent);stroke-width:2}.control{fill:var(--green);stroke:#65dfa0;stroke-width:2}.warn{fill:var(--orange);stroke:#ffc267;stroke-width:2}.txt{fill:var(--ink);font-size:22px;font-weight:700}.line{stroke:var(--line);stroke-width:3}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--blue:#e8f2fb;--green:#e7f6ee;--orange:#fff4df;--accent:#1769aa;--line:#9aabba}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="110">3단계 · 정책 기반 차단 및 출력 검열</text><text class="sub" x="60" y="150">입력은 판정하고 출력은 민감정보를 마스킹한다</text><g text-anchor="middle"><rect class="box" x="80" y="280" width="220" height="130" rx="16"/><text class="txt" x="190" y="330">입력 정책</text><text class="small" x="190" y="370">허용·차단·검토</text><rect class="warn" x="370" y="280" width="220" height="130" rx="16"/><text class="txt" x="480" y="330">위험 요청</text><text class="small" x="480" y="370">정책 위반 차단</text><rect class="box" x="660" y="280" width="220" height="130" rx="16"/><text class="txt" x="770" y="330">모델 출력</text><text class="small" x="770" y="370">응답 후처리</text><rect class="control" x="950" y="280" width="220" height="130" rx="16"/><text class="txt" x="1060" y="330">출력 검열</text><text class="small" x="1060" y="370">PII·API 키 마스킹</text></g><path class="line" d="M300 345h70M590 345h70M880 345h70"/><text class="foot" x="60" y="