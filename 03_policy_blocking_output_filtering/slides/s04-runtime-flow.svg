<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
  <title id="t">3단계 코드 실행 흐름도</title>
  <desc id="d">guardrail.py를 직접 실행할 때 __main__부터 safe_response·check_input·redact_output·결과 저장까지의 함수 호출 순서와 판정 분기</desc>
  <style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#ffc267;--good:#65dfa0;--code:#0b1220}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:18px}.accent{fill:var(--accent);font-size:18px;font-weight:700}.good{fill:var(--good);font-size:18px;font-weight:700}.field{fill:var(--ink);font-size:16px;font-weight:700}.val{fill:var(--muted);font-size:15px}.code{fill:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:14px}.codebox{fill:var(--code);stroke:var(--line);stroke-width:1.5}.note{fill:var(--muted);font-size:14px}.foot{fill:var(--muted);font-size:14px}.arrow{stroke:var(--line);stroke-width:3;fill:none;marker-end:url(#a)}.mk{fill:var(--line)}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--accent:#1769aa;--good:#16704a;--code:#f4f6f9}}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="60" y="90">3단계 · 코드 실행 흐름도</text>
  <text class="sub" x="60" y="126">python src/guardrail.py — __main__에서 결과 저장까지의 호출 순서</text>

  <!-- left: call chain -->
  <rect class="panel" x="60" y="160" width="560" height="440" rx="16"/>
  <text class="h" x="90" y="205">실행 순서 (guardrail.py)</text>
  <g>
    <rect class="codebox" x="90" y="222" width="500" height="44" rx="10"/>
    <text class="code" x="112" y="250" font-size="13">__main__: safe_response(prompt, response)</text>
    <path class="arrow" d="M340 266 V282"/>
    <rect class="codebox" x="90" y="284" width="500" height="44" rx="10"/>
    <text class="code" x="112" y="312" font-size="13">import policy → load_rules() → INPUT_RULES</text>
    <path class="arrow" d="M340 328 V344"/>
    <rect class="codebox" x="90" y="346" width="500" height="44" rx="10"/>
    <text class="code" x="112" y="374" font-size="13">check_input() → inspect_input() 규칙 순차 검색</text>
    <path class="arrow" d="M340 390 V406"/>
    <rect class="codebox" x="90" y="408" width="500" height="44" rx="10"/>
    <text class="code" x="112" y="436" font-size="13">ALLOW이면 redact_output() → OUTPUT_PATTERNS</text>
    <path class="arrow" d="M340 452 V468"/>
    <rect class="codebox" x="90" y="470" width="500" height="44" rx="10"/>
    <text class="code" x="112" y="498" font-size="13">result_payload() → write_result() + write_report()</text>
    <path class="arrow" d="M340 514 V530"/>
    <rect class="codebox" x="90" y="532" width="500" height="44" rx="10"/>
    <text class="code" x="112" y="560" font-size="13">results/step03-guardrail-result.json + .html</text>
  </g>
  <text class="note" x="90" y="606" font-size="15">모델 호출 없이 더미 응답으로 재현 — BLOCK이면 출력 검열 생략</text>

  <!-- right: branches -->
  <rect class="panel" x="660" y="160" width="560" height="440" rx="16"/>
  <text class="h" x="690" y="205">판정 분기 규칙</text>
  <g>
    <text class="field" x="690" y="248">check_input()</text>
    <text class="val" x="830" y="248">matches ≥1 → BLOCK + highest_risk / 0 → ALLOW·Low</text>
    <text class="field" x="690" y="288">BLOCK 분기</text>
    <text class="val" x="830" y="288">safe_response 즉시 반환 — model_response 미사용</text>
    <text class="field" x="690" y="328">redact_output()</text>
    <text class="val" x="830" y="328">masked_fields 없음 → ALLOW Low / 있음 → REVIEW</text>
    <text class="val" x="850" y="358">api_key·secret_keyword → Critical / 그 외 → High</text>
    <text class="field" x="690" y="398">result_payload()</text>
    <text class="val" x="830" y="398">schema_version·event_id·trace_id·source_stage·next=04</text>
    <text class="field" x="690" y="438">OUTPUT_PATTERNS</text>
    <text class="val" x="830" y="438">email · api_key · phone · secret_keyword 4종 순회</text>
  </g>
  <rect class="codebox" x="690" y="480" width="500" height="80" rx="10"/>
  <text class="code" x="712" y="508" font-size="13">실행: python 03_policy_blocking_output_filtering/src/guardrail.py</text>
  <text class="code" x="712" y="532" font-size="12" fill="var(--muted)">→ results/step03-guardrail-result.json + .html</text>
  <text class="accent" x="690" y="592" font-size="16">4단계로 전달: decision · risk · matches · masked_fields</text>

  <text class="foot" x="60" y="705">3단계 · 코드 실행 흐름도 · 4 / 10</text>
</svg>
