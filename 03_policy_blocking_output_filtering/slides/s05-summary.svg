<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">정책과 출력 검열 요약</title><desc id="d">3단계 구현 원칙과 실습 질문</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#ffc267}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:19px}.accent{fill:var(--accent);font-size:19px;font-weight:700}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">3단계 · 핵심 요약과 실습 질문</text><text class="sub" x="60" y="145">탐지·판정·대응을 분리하면 정책을 설명할 수 있다</text><rect class="panel" x="80" y="230" width="520" height="280" rx="16"/><text class="h" x="115" y="280">핵심 메시지</text><text class="p" x="115" y="330">입력은 규칙 위반 여부를 판정한다</text><text class="p" x="115" y="370">출력은 민감 필드를 찾아 마스킹한다</text><text class="p" x="115" y="410">오탐·미탐을 테스트셋으로 측정한다</text><rect class="panel" x="660" y="230" width="540" height="280" rx="16"/><text class="h" x="695" y="280">실습 질문</text><text class="accent" x="695" y="330">규칙 ID와 차단 사유를 남겼는가?</text><text class="accent" x="695" y="370">마스킹 전 원문이 로그에 남지 않는가?</text><text class="accent" x="695" y="410">safe_response()가 순서를 보장하는가?</text><text class="foot" x="60" y="666">3단계 · 3단계 · 5 / 5</text></svg>
