<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">3단계 LLM 없이 가능한 실습</title><desc id="d">3단계 정책 차단·출력 마스킹은 정규식 등 결정론적 로직으로 동작해 LLM 없이 실행 가능하며, 모델 판정은 2단계가 담당한다</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#ffc267;--good:#65dfa0;--warn:#ffc267}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:19px}.accent{fill:var(--accent);font-size:19px;font-weight:700}.good{fill:var(--good);font-size:19px;font-weight:700}.warn{fill:var(--warn);font-size:19px;font-weight:700}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--accent:#1769aa;--good:#16704a;--warn:#b45309}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">3단계 · LLM 없이 가능한 실습</text><text class="sub" x="60" y="145">정책·마스킹은 결정론적 로직 — 모델 판정은 2단계가 담당한다</text><rect class="panel" x="80" y="220" width="520" height="330" rx="16"/><text class="h" x="115" y="270">이 단계의 구현 — LLM 불필요</text><text class="good" x="115" y="315">입력 차단</text><text class="p" x="150" y="345">policy-rules.json 정규식 매칭 → BLOCK</text><text class="good" x="115" y="390">출력 마스킹</text><text class="p" x="150" y="420">OUTPUT_PATTERNS 정규식 → [FIELD_REDACTED]</text><text class="good" x="115" y="465">데모 실행</text><text class="p" x="150" y="495">더미 응답 문자열 — 실제 모델 호출 없음</text><rect class="panel" x="660" y="220" width="540" height="330" rx="16"/><text class="h" x="695" y="270">LLM이 들어가는 단계</text><text class="warn" x="695" y="315">2단계 · 실추론</text><text class="p" x="695" y="345">Llama Guard·NeMo Guardrails — Ollama 필요</text><text class="warn" x="695" y="390">5·6단계 · 선택적</text><text class="p" x="695" y="420">USE_LLM=1 설정 시에만 로컬 LLM 호출</text><text class="accent" x="695" y="480">3단계는 규칙만으로 재현 가능 — Ollama 없이도 완주 가능</text><text class="foot" x="60" y="640">실행: python 03_policy_blocking_output_filtering/src/guardrail.py → results/ JSON + HTML</text><text class="foot" x="60" y="672">3단계 · LLM 불필요 실습 안내 · 9 / 10</text></svg>
