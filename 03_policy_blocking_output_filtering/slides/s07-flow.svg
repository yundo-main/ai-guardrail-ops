<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">3단계 실습 Flow · 정책 차단과 출력 검열</title><desc id="d">guardrail.py 실행 시 입력 정책 판정, 출력 마스킹, 결과 JSON·HTML 생성, 확인과 4단계 전달까지의 실습 흐름</desc><defs><style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Helvetica Neue",Arial,sans-serif;fill:#0f172a}.title{font-size:50px;font-weight:800}.subt{font-size:25px;fill:#475569}.h2{font-size:26px;font-weight:800}.h3{font-size:24px;font-weight:800}.body{font-size:20px;fill:#334155}.sm{font-size:16px;fill:#475569}.sm17{font-size:17px;fill:#475569}.lbl{font-size:16px;font-weight:700}.g{fill:#15803d}.o{fill:#c2410c}.bdg{font-size:20px;font-weight:800;fill:#ffffff}.bar{font-size:24px;font-weight:800;fill:#ffffff}.monob,.mono17,.mono19{font-family:Menlo,Consolas,"Courier New",monospace;fill:#0f172a}.monob{font-size:20px;font-weight:700}.mono17{font-size:16px;fill:#334155}.mono19{font-size:19px;fill:#334155}</style><marker id="ab" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 1L15 8L0 15Z" fill="#1d4ed8"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 1L15 8L0 15Z" fill="#15803d"/></marker><marker id="ao" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 1L15 8L0 15Z" fill="#c2410c"/></marker><marker id="ap" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 1L15 8L0 15Z" fill="#7c3aed"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text class="title" x="60" y="80">3단계 실습 Flow · 정책 차단과 출력 검열</text><text class="subt" x="60" y="124">guardrail.py 실행부터 결과 JSON 확인, 4단계 전달까지 (LLM 불필요)</text><rect x="60" y="170" width="900" height="82" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="170" width="10" height="82" rx="5" fill="#1d4ed8"/><text x="106" y="200" font-size="30" text-anchor="middle" dominant-baseline="central">①</text><text class="h3" x="140" y="208">단위 테스트 (선택)</text><text class="mono17" x="140" y="230">python3 -m unittest discover -s 03_policy_blocking_output_filtering/tests -v</text><path d="M510 252V276" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ab)"/><rect x="60" y="280" width="900" height="422" rx="14" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="10 6"/><text x="106" y="312" font-size="30" text-anchor="middle" dominant-baseline="central">②</text><text class="h3" x="140" y="320">python3 src/guardrail.py 실행 · safe_response()</text><rect x="340" y="332" width="240" height="62" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text class="monob" x="460" y="358" text-anchor="middle">policy-rules.json</text><text class="sm" x="460" y="381" text-anchor="middle">규칙 4종 · load_rules()</text><path d="M460 394V420" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#ap)"/><rect x="80" y="424" width="210" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><text class="h3" x="185.0" y="458" text-anchor="middle">입력 프롬프트</text><text class="sm" x="185.0" y="484" text-anchor="middle">정상 문의 (데모)</text><rect x="340" y="424" width="240" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><text class="monob" x="460.0" y="458" text-anchor="middle">check_input()</text><text class="sm" x="460.0" y="484" text-anchor="middle">inspect_input() 전 규칙 검사</text><rect x="640" y="424" width="300" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><text class="h3" x="790.0" y="458" text-anchor="middle">정책 판정</text><text class="sm" x="790.0" y="484" text-anchor="middle">매칭 있음 → BLOCK</text><text class="sm" x="790.0" y="506" text-anchor="middle">매칭 없음 → ALLOW</text><path d="M290 469H336" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ab)"/><path d="M580 469H636" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ab)"/><path d="M700 514V548H185V580" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#ag)"/><text class="lbl g" x="300" y="540">ALLOW</text><path d="M880 514V580" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#ao)"/><text class="lbl o" x="892" y="552">BLOCK</text><rect x="80" y="584" width="210" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><text class="h3" x="185.0" y="618" text-anchor="middle">더미 모델 응답</text><text class="sm" x="185.0" y="644" text-anchor="middle">이메일·API 키 포함</text><rect x="340" y="584" width="240" height="90" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/><text class="monob" x="460.0" y="618" text-anchor="middle">redact_output()</text><text class="sm" x="460.0" y="644" text-anchor="middle">4패턴 순차 치환</text><rect x="640" y="584" width="300" height="90" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/><text class="h3" x="790.0" y="618" text-anchor="middle">BLOCK 결과</text><text class="sm" x="790.0" y="644" text-anchor="middle">차단 문구 반환</text><text class="sm" x="790.0" y="666" text-anchor="middle">모델 응답은 사용하지 않음</text><path d="M290 629H336" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#ag)"/><path d="M460 674V726" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#ag)"/><text class="lbl g" x="472" y="722">REVIEW</text><path d="M790 674V726" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#ao)"/><text class="lbl o" x="802" y="722">BLOCK</text><rect x="60" y="730" width="900" height="86" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="730" width="10" height="86" rx="5" fill="#1d4ed8"/><text x="106" y="760" font-size="30" text-anchor="middle" dominant-baseline="central">③</text><text class="h3" x="140" y="768">산출물 생성</text><text class="mono17" x="140" y="794">results/step03-guardrail-result.json · .html</text><path d="M510 816V838" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ab)"/><rect x="60" y="842" width="900" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="842" width="10" height="88" rx="5" fill="#1d4ed8"/><text x="106" y="872" font-size="30" text-anchor="middle" dominant-baseline="central">④</text><text class="h3" x="140" y="880">확인 · 4단계 전달</text><text class="mono17" x="140" y="908">json.tool · open *.html 확인 → 04_risk_rating_system 입력</text><rect x="1000" y="170" width="860" height="178" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1000" y="170" width="10" height="178" rx="5" fill="#1d4ed8"/><text class="h2" x="1032" y="212">① 실행 조건</text><text class="body" x="1032" y="246">저장소 루트(ai-guardrail-ops)에서 실행한다.</text><text class="body" x="1032" y="274">LLM·Ollama 없이 정규식으로 결정론적으로 동작한다.</text><text class="body" x="1032" y="302">단위 테스트(tests/test_guardrail.py)는 선택 단계다.</text><rect x="1000" y="364" width="860" height="178" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1000" y="364" width="10" height="178" rx="5" fill="#7c3aed"/><text class="h2" x="1032" y="406">② 입력 판정 · policy.py</text><text class="body" x="1032" y="440">INJ-001·EXF-001·TOOL-001·ABUSE-001 전 규칙 검사</text><text class="body" x="1032" y="468">첫 매치에서 멈추지 않고 모든 위반을 기록한다.</text><text class="body" x="1032" y="496">highest_risk()로 최고 등급을 최종 위험으로 쓴다.</text><text class="body" x="1032" y="524">BLOCK이면 모델·출력 단계 없이 차단 문구를 반환한다.</text><rect x="1000" y="558" width="860" height="178" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1000" y="558" width="10" height="178" rx="5" fill="#15803d"/><text class="h2" x="1032" y="600">② 출력 검열 · guardrail.py</text><text class="body" x="1032" y="634">순서: email → api_key → phone → secret_keyword</text><text class="body" x="1032" y="662">치환 형식 [FIELD_REDACTED]와 탐지 필드명을 기록한다.</text><text class="body" x="1032" y="690">api_key·secret_keyword 포함 시 Critical, 그 외 High.</text><text class="body" x="1032" y="718">마스킹이 발생하면 review, 없으면 allow로 판정한다.</text><rect x="1000" y="752" width="860" height="178" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1000" y="752" width="10" height="178" rx="5" fill="#0f766e"/><text class="h2" x="1032" y="794">③④ 검증 기준 (데모 기대값)</text><text class="body" x="1032" y="828">decision=review · risk=Critical</text><text class="body" x="1032" y="856">masked_fields=[email, api_key] · matches=[]</text><text class="mono19" x="1032" y="884">grep -cE 'sk_demo|learner@' step03-guardrail-result.json</text><text class="body" x="1032" y="912">→ 0건이어야 한다. 원문이 남으면 마스킹 실패로 본다.</text><rect x="0" y="952" width="1920" height="84" fill="#0f172a"/><text class="bar" x="960" y="1003" text-anchor="middle">입력 차단(모델 호출 전) → 출력 마스킹(사용자 경계 전) → 결과 JSON(4단계 전달)</text></svg>