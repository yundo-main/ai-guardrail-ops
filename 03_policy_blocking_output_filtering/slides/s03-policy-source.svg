<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">정책과 가드레일 소스코드</title><desc id="d">policy.py와 guardrail.py의 함수와 실행 방법</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--code:#d9e7f5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:17px}.code{fill:var(--code);font-family:monospace;font-size:17px}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--code:#20344a}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">3단계 · 실습: 정책 소스코드</text><text class="sub" x="60" y="145">정책 판정 결과가 출력 검열과 이벤트 생성으로 이어진다</text><rect class="panel" x="70" y="220" width="540" height="300" rx="16"/><text class="h" x="100" y="265">핵심 파일</text><text class="p" x="100" y="315">03.../src/policy.py</text><text class="p" x="100" y="350">inspect_input() · highest_risk()</text><text class="p" x="100" y="400">03.../src/guardrail.py</text><text class="p" x="100" y="435">check_input() · redact_output()</text><rect class="panel" x="670" y="220" width="540" height="300" rx="16"/><text class="h" x="700" y="265">실행 흐름</text><text class="code" x="700" y="325">prompt → check_input()</text><text class="code" x="700" y="360">response → redact_output()</text><text class="code" x="700" y="395">safe_response() → GuardrailResult</text><text class="p" x="700" y="430">사용 이유: 정책을 반복 실행하고 오탐·미탐을 검증하기 위해</text><text class="p" x="700" y="475">실행: python3 -m unittest discover -s tests -v</text><text class="foot" x="60" y="666">3단계 · 3단계 · 3 / 10</text></svg>
