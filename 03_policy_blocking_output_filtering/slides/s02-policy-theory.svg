<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">정책 차단과 출력 검열 이론</title><desc id="d">입력 정책과 출력 검열의 판정 기준</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--blue:#173b63;--green:#183d2d;--orange:#3b2b18;--accent:#60aef5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.box{fill:var(--blue);stroke:var(--accent);stroke-width:2}.control{fill:var(--green);stroke:#65dfa0;stroke-width:2}.warn{fill:var(--orange);stroke:#ffc267;stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:18px}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--blue:#e8f2fb;--green:#e7f6ee;--orange:#fff4df;--accent:#1769aa}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">3단계 · 이론: 판정과 마스킹</text><text class="sub" x="60" y="145">입력은 요청 자체를, 출력은 노출 결과를 검사한다</text><text class="sub" x="60" y="185">배경: 모델 안전성만으로는 조직별 데이터·권한 정책을 충분히 표현하기 어렵다</text><rect class="warn" x="80" y="250" width="340" height="210" rx="16"/><text class="h" x="115" y="300">입력 정책</text><text class="p" x="115" y="345">규칙 ID·패턴·사유</text><text class="p" x="115" y="380">위험 등급·결정</text><text class="p" x="115" y="415">위반 시 차단 또는 검토</text><rect class="control" x="470" y="250" width="340" height="210" rx="16"/><text class="h" x="505" y="300">출력 검열</text><text class="p" x="505" y="345">PII·API 키 탐지</text><text class="p" x="505" y="380">필드별 마스킹</text><text class="p" x="505" y="415">민감도에 따른 검토</text><rect class="box" x="860" y="250" width="340" height="210" rx="16"/><text class="h" x="895" y="300">안전한 결과</text><text class="p" x="895" y="345">차단 안내 응답</text><text class="p" x="895" y="380">마스킹된 응답</text><text class="p" x="895" y="415">보안 이벤트 기록</text><text class="foot" x="60" y="666">3단계 · 3단계 · 2 / 5</text></svg>
