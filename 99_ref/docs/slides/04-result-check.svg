<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="result-check-title result-check-desc">
  <title id="result-check-title">단계별 결과 확인 방법</title>
  <desc id="result-check-desc">3·4·6단계 JSON 결과 확인, 5단계 API와 웹 대시보드 확인, 결과 계약 추적 방법</desc>
  <style>
    :root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--blue:#1769aa;--blue-soft:#e8f2fb;--green:#16704a;--green-soft:#e7f6ee;--orange:#b45309;--orange-soft:#fff4df;--line:#9aabba;--code:#1a2f45}
    *{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
    .bg{fill:var(--bg)}.title{fill:var(--ink);font-size:36px;font-weight:700}.sub{fill:var(--muted);font-size:18px}
    .cp{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}
    .ca{fill:var(--green-soft);stroke:var(--green);stroke-width:2}
    .cr{fill:var(--orange-soft);stroke:var(--orange);stroke-width:2}
    .h{fill:var(--ink);font-size:18px;font-weight:700}.p{fill:var(--muted);font-size:15px}
    .code{fill:var(--code);font-family:'Menlo','Courier New',monospace;font-size:13px}
    .foot{fill:var(--muted);font-size:14px}}
  </style>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="60" y="90">단계별 결과 확인 방법</text>
  <text class="sub"   x="60" y="124">실행 출력·JSON 파일·API 화면을 구분해 결과를 검증한다</text>

  <!-- 패널 3개: 너비=360, 간격=20 → 60+360+20+360+20+360=1180 ≤ 1280 -->
  <!-- 패널 1: 03·04·06 JSON -->
  <rect class="cp" x="60"  y="158" width="360" height="345" rx="14"/>
  <text class="h"  x="84"  y="196">03·04·06단계 JSON</text>
  <text class="p"  x="84"  y="226">정책·이벤트·통합 리포트 확인</text>
  <text class="code" x="84" y="268">python3 -m json.tool \</text>
  <text class="code" x="84" y="290">  results/step03-guardrail-result.json</text>
  <text class="code" x="84" y="330">python3 -m json.tool \</text>
  <text class="code" x="84" y="352">  results/step04-security-event.json</text>
  <text class="code" x="84" y="392">python3 -m json.tool \</text>
  <text class="code" x="84" y="414">  results/step06-report.json</text>
  <text class="p"  x="84"  y="454">확인 필드: decision · risk · trace_id</text>
  <text class="p"  x="84"  y="478">status · source_stage · schema_version</text>

  <!-- 패널 2: 05단계 API -->
  <rect class="ca" x="440" y="158" width="360" height="345" rx="14"/>
  <text class="h"  x="464" y="196">05단계 API · 화면</text>
  <text class="p"  x="464" y="226">지표 · Critical 알림 · SQLite</text>
  <text class="code" x="464" y="268">curl http://127.0.0.1:8000/health</text>
  <text class="code" x="464" y="300">curl -H "X-API-Key: KEY" \</text>
  <text class="code" x="464" y="322">  http://127.0.0.1:8000/metrics</text>
  <text class="code" x="464" y="362">curl -H "X-API-Key: KEY" \</text>
  <text class="code" x="464" y="384">  http://127.0.0.1:8000/alerts/critical</text>
  <text class="p"  x="464" y="424">Swagger: http://127.0.0.1:8000/docs</text>
  <text class="p"  x="464" y="454">Dashboard: /dashboard</text>
  <text class="p"  x="464" y="478">API Key: GUARDRAIL_API_KEY 환경변수</text>

  <!-- 패널 3: 계약·점층 확인 -->
  <rect class="cr" x="820" y="158" width="400" height="345" rx="14"/>
  <text class="h"  x="844" y="196">계약·점층 확인</text>
  <text class="p"  x="844" y="226">결과가 다음 단계로 이어지는지 확인</text>
  <text class="code" x="844" y="268">schema_version: "1.0"</text>
  <text class="code" x="844" y="298">event_id / trace_id</text>
  <text class="code" x="844" y="328">source_stage / next_stage</text>
  <text class="code" x="844" y="358">decision: allow|block|review</text>
  <text class="code" x="844" y="388">risk: Low|Medium|High|Critical</text>
  <text class="p"  x="844" y="424">독립 결과: results/</text>
  <text class="p"  x="844" y="454">통합 결과: integration/results/</text>
  <text class="p"  x="844" y="478">테스트: python3 -m unittest discover</text>

  <!-- 푸터 -->
  <text class="foot" x="60"   y="668">실행 순서: 03 JSON → 04 이벤트 → 05 API 지표 → 06 리포트 · API 요청에는 X-API-Key 사용</text>
  <text class="foot" x="1220" y="668" text-anchor="end">1 / 1</text>
</svg>
