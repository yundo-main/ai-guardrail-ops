<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">4단계 실습 Flow · 위험 등급 체계</title><desc id="d">3단계 결과 JSON을 읽어 SecurityEvent로 변환하고 이벤트 JSON·HTML을 저장해 5단계로 전달하는 실습 흐름</desc><defs><style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Helvetica Neue",Arial,sans-serif;fill:#0f172a}.title{font-size:50px;font-weight:800}.subt{font-size:25px;fill:#475569}.h2{font-size:26px;font-weight:800}.h3{font-size:24px;font-weight:800}.body{font-size:20px;fill:#334155}.sm{font-size:16px;fill:#475569}.lbl{font-size:16px;font-weight:700}.g{fill:#15803d}.o{fill:#c2410c}.b{fill:#1d4ed8}.s{fill:#475569}.bdg{font-size:20px;font-weight:800;fill:#ffffff}.bar{font-size:24px;font-weight:800;fill:#ffffff}.monob,.monos,.mono17,.mono19{font-family:Menlo,Consolas,"Courier New",monospace;fill:#0f172a}.monob{font-size:20px;font-weight:700}.monos{font-size:17px;font-weight:700}.mono17{font-size:16px;fill:#334155}.mono19{font-size:19px;fill:#334155}</style><marker id="ab" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 1L15 8L0 15Z" fill="#1d4ed8"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 1L15 8L0 15Z" fill="#15803d"/></marker><marker id="ao" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 1L15 8L0 15Z" fill="#c2410c"/></marker><marker id="ap" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 1L15 8L0 15Z" fill="#7c3aed"/></marker><marker id="as" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 1L15 8L0 15Z" fill="#64748b"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text class="title" x="60" y="80">4단계 실습 Flow · 위험 등급 체계</text><text class="subt" x="60" y="124">3단계 결과 JSON을 SecurityEvent로 변환해 5단계로 전달한다 (LLM 불필요)</text><rect x="60" y="170" width="900" height="82" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="170" width="10" height="82" rx="5" fill="#1d4ed8"/><text x="106" y="200" font-size="30" text-anchor="middle" dominant-baseline="central">①</text><text class="h3" x="140" y="208">사전 조건 · 3단계 결과 생성 (없을 때)</text><text class="mono17" x="140" y="230">python3 03_policy_blocking_output_filtering/src/guardrail.py</text><path d="M510 252V276" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ab)"/><rect x="60" y="280" width="900" height="422" rx="14" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="10 6"/><text x="106" y="312" font-size="30" text-anchor="middle" dominant-baseline="central">②</text><text class="mono17" x="140" y="318">PYTHONPATH=04_risk_rating_system/src python3 04_risk_rating_system/src/risk.py</text><rect x="80" y="334" width="340" height="62" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text class="monos" x="250.0" y="358" text-anchor="middle">step03-guardrail-result.json</text><text class="sm" x="250.0" y="381" text-anchor="middle">경계: JSON 파일 (모듈 import 없음)</text><path d="M200 396V420" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#ap)"/><rect x="80" y="424" width="240" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><text class="h3" x="200.0" y="458" text-anchor="middle">결과 파일 존재?</text><text class="sm" x="200.0" y="484" text-anchor="middle">source_path.exists()</text><rect x="370" y="424" width="290" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><text class="monos" x="515.0" y="458" text-anchor="middle">event_from_guardrail_file()</text><text class="sm" x="515.0" y="484" text-anchor="middle">decision·risk를 enum으로 변환</text><rect x="710" y="424" width="230" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><text class="monob" x="825.0" y="458" text-anchor="middle">make_event()</text><text class="sm" x="825.0" y="484" text-anchor="middle">UTC 시각 · status=open</text><path d="M320 469H366" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#ag)"/><text class="lbl g" x="327" y="458">YES</text><path d="M660 469H706" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ab)"/><path d="M200 514V580" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#as)"/><text class="lbl s" x="212" y="552">NO</text><rect x="80" y="584" width="240" height="90" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/><text class="monos" x="200.0" y="618" text-anchor="middle">classify_risk(3,3,3)</text><text class="sm" x="200.0" y="644" text-anchor="middle">파일 없을 때만 실행</text><text class="sm" x="200.0" y="666" text-anchor="middle">점수 예시(Critical)만 출력</text><path d="M825 514V548H515V580" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ab)"/><rect x="370" y="584" width="290" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><text class="monob" x="515.0" y="618" text-anchor="middle">write_event_result()</text><text class="sm" x="515.0" y="644" text-anchor="middle">event_payload() · next=05 추가</text><rect x="710" y="584" width="230" height="90" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/><text class="monob" x="825.0" y="618" text-anchor="middle">write_report()</text><text class="sm" x="825.0" y="644" text-anchor="middle">HTML 보고서</text><path d="M660 629H706" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#ag)"/><path d="M515 674V726" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ab)"/><text class="lbl b" x="527" y="722">JSON</text><path d="M825 674V726" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#ag)"/><text class="lbl g" x="837" y="722">HTML</text><rect x="60" y="730" width="900" height="86" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="730" width="10" height="86" rx="5" fill="#1d4ed8"/><text x="106" y="760" font-size="30" text-anchor="middle" dominant-baseline="central">③</text><text class="h3" x="140" y="768">산출물 생성</text><text class="mono17" x="140" y="794">results/step04-security-event.json · .html</text><path d="M510 816V838" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ab)"/><rect x="60" y="842" width="900" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="842" width="10" height="88" rx="5" fill="#1d4ed8"/><text x="106" y="872" font-size="30" text-anchor="middle" dominant-baseline="central">④</text><text class="h3" x="140" y="880">확인 · 5단계 전달</text><text class="mono17" x="140" y="908">json.tool · open *.html 확인 → 05 /events API 입력</text><rect x="1000" y="170" width="860" height="178" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1000" y="170" width="10" height="178" rx="5" fill="#1d4ed8"/><text class="h2" x="1032" y="212">① 실행 조건</text><text class="body" x="1032" y="246">저장소 루트에서 실행한다. LLM·Ollama는 필요 없다.</text><text class="body" x="1032" y="274">3단계 결과 JSON이 먼저 있어야 이벤트로 변환된다.</text><text class="body" x="1032" y="302">파일이 없으면 점수 예시만 출력하고 파일은 만들지 않는다.</text><rect x="1000" y="364" width="860" height="178" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1000" y="364" width="10" height="178" rx="5" fill="#7c3aed"/><text class="h2" x="1032" y="406">② 변환 규칙 · risk.py</text><text class="body" x="1032" y="440">3단계 JSON의 decision·risk를 그대로 변환한다.</text><text class="body" x="1032" y="468">classify_risk()는 이 경로에서 호출되지 않는다.</text><text class="body" x="1032" y="496">category 기본값은 guardrail, detail은 빈 문자열이다.</text><text class="body" x="1032" y="524">event_id·trace_id를 3단계 값에서 승계한다.</text><rect x="1000" y="558" width="860" height="178" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1000" y="558" width="10" height="178" rx="5" fill="#15803d"/><text class="h2" x="1032" y="600">③ 이벤트 필드 · monitoring.py</text><text class="body" x="1032" y="634">make_event()가 UTC timestamp와 trace_id를 부여한다.</text><text class="body" x="1032" y="662">schema_version 1.0 · source_stage step04 · policy-1</text><text class="body" x="1032" y="690">status는 open, acknowledged_at은 null로 시작한다.</text><text class="body" x="1032" y="718">event_payload()가 next=05_security_dashboard_alerts 추가.</text><rect x="1000" y="752" width="860" height="178" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1000" y="752" width="10" height="178" rx="5" fill="#0f766e"/><text class="h2" x="1032" y="794">④ 검증 기준 (현재 결과 기대값)</text><text class="body" x="1032" y="828">decision=review · risk=Critical · status=open</text><text class="body" x="1032" y="856">next=05_security_dashboard_alerts</text><text class="mono19" x="1032" y="884">python3 -m json.tool results/step04-security-event.json</text><text class="body" x="1032" y="912">→ 3단계 risk와 다르면 변환 오류로 본다.</text><rect x="0" y="952" width="1920" height="84" fill="#0f172a"/><text class="bar" x="960" y="1003" text-anchor="middle">3단계 JSON 읽기 → SecurityEvent 변환 → 이벤트 JSON·HTML 저장(5단계 /events 전달)</text></svg>