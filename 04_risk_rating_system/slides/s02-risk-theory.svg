<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">위험 등급 설계 이론</title><desc id="d">영향과 악용 가능성에 따른 네 단계 위험 등급</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--blue:#173b63;--orange:#3b2b18;--red:#54242a;--accent:#60aef5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.box{fill:var(--blue);stroke:var(--accent);stroke-width:2}.warn{fill:var(--orange);stroke:#ffc267;stroke-width:2}.critical{fill:var(--red);stroke:#ff737d;stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:18px}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--blue:#e8f2fb;--orange:#fff4df;--red:#fde8ea;--accent:#1769aa}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">4단계 · 이론: 위험 등급과 대응</text><text class="sub" x="60" y="145">영향·악용 가능성·노출 범위를 함께 보고 대응 강도를 정한다</text><text class="sub" x="60" y="185">배경: 모든 이벤트를 같은 긴급도로 처리하면 중요한 사건을 놓칠 수 있다</text><rect class="box" x="80" y="250" width="250" height="210" rx="16"/><text class="h" x="115" y="300">Low</text><text class="p" x="115" y="345">관찰·기록</text><text class="p" x="115" y="380">반복 여부 확인</text><rect class="warn" x="380" y="250" width="250" height="210" rx="16"/><text class="h" x="415" y="300">Medium / High</text><text class="p" x="415" y="345">검토·차단</text><text class="p" x="415" y="380">담당자 에스컬레이션</text><rect class="critical" x="680" y="250" width="250" height="210" rx="16"/><text class="h" x="715" y="300">Critical</text><text class="p" x="715" y="345">즉시 알림·대응</text><text class="p" x="715" y="380">사후 분석과 재발 방지</text><rect class="box" x="980" y="250" width="220" height="210" rx="16"/><text class="h" x="1015" y="300">기록</text><text cl