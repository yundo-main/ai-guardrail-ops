<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
  <title id="t">4단계 코드 실행 흐름도</title>
  <desc id="d">risk.py를 실행할 때 3단계 결과 JSON을 읽어 SecurityEvent 생성·직렬화·저장까지의 호출 순서와 classify_risk 점수 규칙</desc>
  <style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#ffc267;--good:#65dfa0;--code:#0b1220}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:18px}.accent{fill:var(--accent);font-size:18px;font-weight:700}.field{fill:var(--ink);font-size:16px;font-weight:700}.val{fill:var(--muted);font-size:15px}.code{fill:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:14px}.codebox{fill:var(--code);stroke:var(--line);stroke-width:1.5}.note{fill:var(--muted);font-size:14px}.foot{fill:var(--muted);font-size:14px}.arrow{stroke:var(--line);stroke-width:3;fill:none;marker-end:url(#a)}.mk{fill:var(--line)}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--accent:#1769aa;--good:#16704a;--code:#f4f6f9}}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="60" y="90">4단계 · 코드 실행 흐름도</text>
  <text class="sub" x="60" y="126">PYTHONPATH=src python3 src/risk.py — 3단계 JSON을 보안 이벤트로 변환</text>

  <!-- left: call chain -->
  <rect class="panel" x="60" y="160" width="560" height="440" rx="16"/>
  <text class="h" x="90" y="205">실행 순서 (risk.py)</text>
  <g>
    <rect class="codebox" x="90" y="222" width="500" height="44" rx="10"/>
    <text class="code" x="112" y="250" font-size="13">__main__: step03-guardrail-result.json 존재 확인</text>
    <path class="arrow" d="M340 266 V282"/>
    <rect class="codebox" x="90" y="284" width="500" height="44" rx="10"/>
    <text class="code" x="112" y="312" font-size="13">event_from_guardrail_file() → json.load</text>
    <path class="arrow" d="M340 328 V344"/>
    <rect class="codebox" x="90" y="346" width="500" height="44" rx="10"/>
    <text class="code" x="112" y="374" font-size="13">make_event() → SecurityEvent (UTC 시각·trace_id)</text>
    <path class="arrow" d="M340 390 V406"/>
    <rect class="codebox" x="90" y="408" width="500" height="44" rx="10"/>
    <text class="code" x="112" y="436" font-size="13">event_payload() → decision·risk 문자열화</text>
    <path class="arrow" d="M340 452 V468"/>
    <rect class="codebox" x="90" y="470" width="500" height="44" rx="10"/>
    <text class="code" x="112" y="498" font-size="13">write_event_result() → step04-security-event.json</text>
    <path class="arrow" d="M340 514 V530"/>
    <rect class="codebox" x="90" y="532" width="500" height="44" rx="10"/>
    <text class="code" x="112" y="560" font-size="13">report.write_report() → .html + print</text>
  </g>
  <text class="note" x="90" y="606" font-size="15">3단계 import 없이 파일 경계로만 연결 — 독립 실행 유지</text>

  <!-- right: rules -->
  <rect class="panel" x="660" y="160" width="560" height="440" rx="16"/>
  <text class="h" x="690" y="205">분기·점수 규칙</text>
  <g>
    <text class="field" x="690" y="248">파일 없음 분기</text>
    <text class="val" x="830" y="248">파일 없음 → classify_risk(3,3,3) 예제만 출력</text>
    <text class="field" x="690" y="288">classify_risk()</text>
    <text class="val" x="830" y="288">score = impact+exploitability+exposure (0~9 클램프)</text>
    <text class="val" x="850" y="318">≥8 Critical · ≥6 High · ≥3 Medium · &lt;3 Low</text>
    <text class="field" x="690" y="358">SecurityEvent 필드</text>
    <text class="val" x="830" y="358">event_id·decision·risk·category·detail·timestamp</text>
    <text class="val" x="850" y="388">trace_id · status=open · policy_version=policy-1</text>
    <text class="field" x="690" y="428">event_payload()</text>
    <text class="val" x="830" y="428">enum→문자열, next=05_security_dashboard_alerts</text>
  </g>
  <rect class="codebox" x="690" y="470" width="500" height="80" rx="10"/>
  <text class="code" x="712" y="498" font-size="13">실행: PYTHONPATH=04_risk_rating_system/src \</text>
  <text class="code" x="712" y="522" font-size="13">  python3 04_risk_rating_system/src/risk.py</text>
  <text class="code" x="712" y="546" font-size="12" fill="var(--muted)">→ results/step04-security-event.json + .html</text>
  <text class="accent" x="690" y="592" font-size="16">5단계 API로 전달: EventRequest 필드와 동일 구조</text>

  <text class="foot" x="60" y="705">4단계 · 코드 실행 흐름도 · 4 / 9</text>
</svg>
