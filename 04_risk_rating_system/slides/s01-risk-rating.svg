<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">위험 등급 체계 설계</title><desc id="d">보안 이벤트를 위험 등급으로 분류하고 대응하는 구조</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--blue:#173b63;--orange:#3b2b18;--red:#54242a;--line:#8fa5bd;--accent:#60aef5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:40px;font-weight:700}.sub,.small{fill:var(--muted);font-size:20px}.box{fill:var(--blue);stroke:var(--accent);stroke-width:2}.warn{fill:var(--orange);stroke:#ffc267;stroke-width:2}.critical{fill:var(--red);stroke:#ff737d;stroke-width:2}.txt{fill:var(--ink);font-size:22px;font-weight:700}.line{stroke:var(--line);stroke-width:3}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--blue:#e8f2fb;--orange:#fff4df;--red:#fde8ea;--accent:#1769aa;--line:#9aabba}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="110">4단계 · 위험 등급 체계 설계</text><text class="sub" x="60" y="150">영향과 긴급도에 따라 대응 수준을 결정한다</text><g text-anchor="middle"><rect class="box" x="100" y="280" width="220" height="130" rx="16"/><text class="txt" x="210" y="330">보안 이벤트</text><text class="small" x="210" y="370">카테고리·상세·시각</text><rect class="warn" x="400" y="280" width="220" height="130" rx="16"/><text class="txt" x="510" y="330">Low / Medium</text><text class="small" x="510" y="370">관찰·검토</text><rect class="warn" x="700" y="280" width="220" height="130" rx="16"/><text class="txt" x="810" y="330">High</text><text class="small" x="810" y="370">차단·에스컬레이션</text><rect class="critical" x="1000" y="280" width="180" height="130" rx="16"/><text class="txt" x="1090" y="330">Critical</text><text class="small" x="1090" y="370">즉시 알림</text></g><path class="line" d="M320 345h80M620 345h80M920 345h80"/><text class="foot" x="60" y="666">4단계 · 4단계 · 1 / 9</text></svg>
