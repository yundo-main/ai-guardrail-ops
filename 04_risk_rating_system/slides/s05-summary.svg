<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">위험 등급 요약</title><desc id="d">4단계 등급 기준과 대응 질문</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#ffc267}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:19px}.accent{fill:var(--accent);font-size:19px;font-weight:700}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">4단계 · 핵심 요약과 실습 질문</text><text class="sub" x="60" y="145">등급을 숫자가 아니라 행동 기준으로 운영한다</text><rect class="panel" x="80" y="230" width="520" height="280" rx="16"/><text class="h" x="115" y="280">핵심 메시지</text><text class="p" x="115" y="330">영향·악용 가능성·노출 범위를 함께 본다</text><text class="p" x="115" y="370">등급마다 대응 시간과 담당자를 정한다</text><text class="p" x="115" y="410">최초 판정과 변경 이력을 보존한다</text><rect class="panel" x="660" y="230" width="540" height="280" rx="16"/><text class="h" x="695" y="280">실습 질문</text><text class="accent" x="695" y="330">Critical의 즉시 대응 조건은 무엇인가?</text><text class="accent" x="695" y="370">등급 변경 사유를 추적할 수 있는가?</text><text class="accent" x="695" y="410">classify_risk() 경계값을 테스트했는가?</text><text class="foot" x="60" y="666">4단계 · 4단계 · 5 / 5</text></svg>
