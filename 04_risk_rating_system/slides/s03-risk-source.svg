<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">위험 등급 소스코드</title><desc id="d">risk.py와 monitoring.py의 이벤트 생성과 판정</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--code:#d9e7f5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:17px}.code{fill:var(--code);font-family:monospace;font-size:17px}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--code:#20344a}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">4단계 · 실습: 위험 등급 소스</text><text class="sub" x="60" y="145">점수와 이벤트 구조를 분리해 일관된 판정을 만든다</text><rect class="panel" x="70" y="220" width="540" height="300" rx="16"/><text class="h" x="100" y="265">04.../src/risk.py</text><text class="p" x="100" y="315">classify_risk(impact, exploitability, exposure)</text><text class="p" x="100" y="365">0~2: Low · 3~5: Medium</text><text class="p" x="100" y="405">6~7: High · 8~9: Critical</text><rect class="panel" x="670" y="220" width="540" height="300" rx="16"/><text class="h" x="700" y="265">04.../src/monitoring.py</text><text class="p" x="700" y="315">SecurityEvent</text><text class="p" x="700" y="355">make_event()</text><text class="p" x="700" y="395">event_id · decision · risk · category · detail</text><text class="p" x="700" y="430">사용 이유: 등급 기준을 일관되게 적용하고 감사하기 위해</text><text class="code" x="700" y="475">PYTHONPATH=04.../src python3 src/risk.py</text><text class="foot" x="60" y="666">4단계 · 4단계 · 3 / 9</text></svg>
