<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">Llama Guard와 NeMo Guardrails 이론</title><desc id="d">안전성 분류와 대화 흐름 제어의 차이</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--blue:#173b63;--green:#183d2d;--accent:#60aef5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.box{fill:var(--blue);stroke:var(--accent);stroke-width:2}.control{fill:var(--green);stroke:#65dfa0;stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:18px}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--blue:#e8f2fb;--green:#e7f6ee;--accent:#1769aa}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">2단계 · 이론: 두 Guardrails의 역할</text><text class="sub" x="60" y="145">분류기는 위험을 판정하고, 대화 정책은 흐름을 제한한다</text><text class="sub" x="60" y="185">배경: 위험 분류와 대화 흐름 제어를 분리해야 정책을 설명하고 교체할 수 있다</text><rect class="box" x="90" y="240" width="490" height="250" rx="16"/><text class="h" x="125" y="290">Llama Guard</text><text class="p" x="125" y="340">대상: 입력 프롬프트와 안전성 카테고리</text><text class="p" x="125" y="380">처리: 위험 요청 분류</text><text class="p" x="125" y="420">결과: 허용·차단 판정</text><rect class="control" x="700" y="240" width="490" height="250" rx="16"/><text class="h" x="735" y="290">NeMo Guardrails</text><text class="p" x="735" y="340">대상: 대화 흐름과 주제 범위</text><text class="p" x="735" y="380">처리: 정책에 맞는 전환</text><text class="p" x="735" y="420">결과: 안전한 응답·주제 복귀</text><text class="foot" x="60" y="666">2단계 · 2단계 · 2 / 8</text></svg>
