<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">Guardrails 적용 체크리스트</title><desc id="d">2단계 기술 비교와 적용 기준 확인</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#65dfa0}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:19px}.mark{fill:var(--accent);font-size:24px;font-weight:700}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--accent:#16704a}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">2단계 · 복습 체크리스트</text><text class="sub" x="60" y="145">분류와 대화 정책을 혼동하지 않고 적용할 수 있는가</text><rect class="panel" x="80" y="230" width="1120" height="280" rx="16"/><text class="mark" x="120" y="300">✓</text><text class="p" x="165" y="300">Llama Guard의 분류 결과와 애플리케이션 결정을 구분한다</text><text class="mark" x="120" y="370">✓</text><text class="p" x="165" y="370">NeMo Guardrails의 대화 흐름 제어 위치를 설명한다</text><text class="mark" x="120" y="440">✓</text><text class="p" x="165" y="440">src/contracts/adapters.py로 적용 단계와 출력 차이를 비교한다</text><text class="foot" x="60" y="666">2단계 · 8 / 9</text></svg>
