<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">Guardrails 적용 요약</title><desc id="d">2단계 핵심 비교와 적용 질문</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#ffc267}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:19px}.accent{fill:var(--accent);font-size:19px;font-weight:700}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="105">2단계 · 핵심 요약과 실습 질문</text><text class="sub" x="60" y="145">분류와 대화 정책을 서비스 흐름에 맞게 조합한다</text><rect class="panel" x="80" y="230" width="520" height="280" rx="16"/><text class="h" x="115" y="280">핵심 메시지</text><text class="p" x="115" y="330">Llama Guard는 위험성을 분류한다</text><text class="p" x="115" y="370">NeMo Guardrails는 대화 경로를 제한한다</text><text class="p" x="115" y="410">최종 차단 결정은 애플리케이션 정책이다</text><rect class="panel" x="660" y="230" width="540" height="280" rx="16"/><text class="h" x="695" y="280">실습 질문</text><text class="accent" x="695" y="330">분류기와 정책의 책임은 어디까지인가?</text><text class="accent" x="695" y="370">오탐 발생 시 검토 경로는 무엇인가?</text><text class="accent" x="695" y="410">main.py compare 결과를 어떻게 기록할까?</text><text class="foot" x="60" y="666">2단계 · 9 / 9</text></svg>
