<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
  <title id="t">2단계 · 실습 순서</title>
  <desc id="d">02단계 실습을 순서대로 실행하는 단계별 명령 안내</desc>
  <style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--panel:#152235;--line:#496078;--accent:#65dfa0}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:38px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.h{fill:var(--ink);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:19px}.mark{fill:var(--accent);font-size:24px;font-weight:700}.foot{fill:var(--muted);font-size:14px}.code{fill:var(--accent);font-family:Menlo,Consolas,"Courier New",monospace}.codebox{fill:var(--bg);stroke:var(--line);stroke-width:1.5}.arrow{stroke:var(--accent);stroke-width:3;fill:none}.mk{fill:var(--accent)}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#edf3f8;--line:#c9d5e1;--accent:#16704a}}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="60" y="90">2단계 · 실습 순서</text>
  <text class="sub" x="60" y="126">오프라인 비교 → 환경 준비 → 실제 provider 호출 순서</text>

  <rect class="panel" x="60" y="160" width="560" height="474" rx="16"/>
  <text class="h" x="90" y="205">실습 순서</text>
    <rect class="codebox" x="95" y="225" width="480" height="56" rx="10"/>
    <circle cx="122" cy="253" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="258" font-size="14" text-anchor="middle">1</text>
    <text class="p" x="148" y="247" font-size="14">어댑터 비교 (오프라인)</text>
    <text class="code" x="148" y="268" font-size="12">python3 02_llama_guard_nemo_guardrails/src/main.py</text>
    <path class="arrow" d="M340 281 V289"/>
    <rect class="codebox" x="95" y="295" width="480" height="56" rx="10"/>
    <circle cx="122" cy="323" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="328" font-size="14" text-anchor="middle">2</text>
    <text class="p" x="148" y="317" font-size="14">환경 준비</text>
    <text class="code" x="148" y="338" font-size="12">uv venv --python 3.12 .venv312 &amp;&amp; uv pip install --python .venv312/bin/python -r 02_llama_guard_nemo_guardrails/requirements-llm.txt</text>
    <path class="arrow" d="M340 351 V359"/>
    <rect class="codebox" x="95" y="365" width="480" height="56" rx="10"/>
    <circle cx="122" cy="393" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="398" font-size="14" text-anchor="middle">3</text>
    <text class="p" x="148" y="387" font-size="14">모델 준비</text>
    <text class="code" x="148" y="408" font-size="12">ollama pull llama-guard3:1b · ollama pull qwen2.5:3b</text>
    <path class="arrow" d="M340 421 V429"/>
    <rect class="codebox" x="95" y="435" width="480" height="56" rx="10"/>
    <circle cx="122" cy="463" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="468" font-size="14" text-anchor="middle">4</text>
    <text class="p" x="148" y="457" font-size="14">실제 호출</text>
    <text class="code" x="148" y="478" font-size="12">source .venv312/bin/activate → python 02_llama_guard_nemo_guardrails/src/main.py real --prompt "..."</text>
    <path class="arrow" d="M340 491 V499"/>
    <rect class="codebox" x="95" y="505" width="480" height="56" rx="10"/>
    <circle cx="122" cy="533" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="538" font-size="14" text-anchor="middle">5</text>
    <text class="p" x="148" y="527" font-size="14">결과 확인</text>
    <text class="code" x="148" y="548" font-size="12">python3 -m json.tool 02_llama_guard_nemo_guardrails/results/step02-real-guardrails.json</text>
    <path class="arrow" d="M340 561 V569"/>
    <rect class="codebox" x="95" y="575" width="480" height="56" rx="10"/>
    <circle cx="122" cy="603" r="13" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text class="h" x="122" y="608" font-size="14" text-anchor="middle">6</text>
    <text class="p" x="148" y="597" font-size="14">단위 테스트 (선택)</text>
    <text class="code" x="148" y="618" font-size="12">python3 -m unittest discover -s 02_llama_guard_nemo_guardrails/tests -v</text>

  <rect class="panel" x="660" y="160" width="560" height="474" rx="16"/>
  <text class="h" x="690" y="205">산출물 · 주의</text>
    <text class="p" x="700" y="250" font-size="15">• 산출물: results/step02-real-guardrails.json + .html</text>
    <text class="p" x="700" y="284" font-size="15">• real은 provider 실패 시 성공으로 위장하지 않음</text>
    <text class="p" x="700" y="318" font-size="15">• --backend transformers는 심화 경로 (s11 참조)</text>

  <text class="foot" x="60" y="705">2단계 · 실습 순서 · 7 / 11</text>
</svg>
