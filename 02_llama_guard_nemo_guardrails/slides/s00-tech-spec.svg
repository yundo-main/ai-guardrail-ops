<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">2단계 학습 기술 사양</title><desc id="d">Llama Guard와 NeMo Guardrails 비교 학습에 필요한 기술</desc><style>:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--panel:#e8f2fb;--line:#1769aa}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.title{fill:var(--ink);font-size:40px;font-weight:700}.sub{fill:var(--muted);font-size:20px}.h{fill:var(--ink);font-size:24px;font-weight:700}.p{fill:var(--muted);font-size:19px}.code{fill:var(--ink);font-family:monospace;font-size:17px}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--ink:#f3f7fb;--muted:#b5c2d1;--panel:#173b63;--line:#60aef5}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="110">2단계 · 학습 기술 사양</text><text class="sub" x="60" y="150">위험 분류와 대화 정책의 적용 위치를 비교한다</text><rect class="panel" x="80" y="230" width="520" height="270" rx="16"/><text class="h" x="115" y="285">필수</text><text class="p" x="115" y="330">Python 3.12+ · Ollama (로컬 LLM)</text><text class="p" x="115" y="370">Llama Guard·NeMo Guardrails 개념</text><text class="p" x="115" y="410">실제 호출: Ollama 기본 · Transformers 선택</text><rect class="panel" x="660" y="230" width="540" height="270" rx="16"/><text class="h" x="695" y="285">실습 파일</text><text class="code" x="695" y="335">src/main.py → compare / real</text><text class="p" x="695" y="380">compare: 두 가드레일 역할 비교</text><text class="p" x="695" y="420">real: 실제 호출 → JSON + HTML</text><text class="p" x="695" y="455">결과: results/step02-*.json</text><text class="foot" x="60" y="666">참고 기술 사양 · 2단계</text></svg>
