<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">Llama Guard와 NeMo Guardrails</title><desc id="d">위험 분류와 대화 정책의 적용 관계</desc><style>:root{--bg:#0b1220;--ink:#f8fafc;--muted:#b5c2d1;--blue:#173b63;--green:#183d2d;--line:#8fa5bd;--accent:#60aef5}*{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.bg{fill:var(--bg)}.title{fill:var(--ink);font-size:40px;font-weight:700}.sub,.small{fill:var(--muted);font-size:20px}.box{fill:var(--blue);stroke:var(--accent);stroke-width:2}.control{fill:var(--green);stroke:#65dfa0;stroke-width:2}.txt{fill:var(--ink);font-size:22px;font-weight:700}.line{stroke:var(--line);stroke-width:3}.foot{fill:var(--muted);font-size:14px}@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--ink:#122033;--muted:#516174;--blue:#e8f2fb;--green:#e7f6ee;--accent:#1769aa;--line:#9aabba}}</style><rect class="bg" width="1280" height="720"/><text class="title" x="60" y="110">2단계 · Llama Guard·NeMo Guardrails 적용</text><text class="sub" x="60" y="150">분류와 대화 정책을 입력 흐름에 연결한다</text><g text-anchor="middle"><rect class="box" x="80" y="280" width="250" height="130" rx="16"/><text class="txt" x="205" y="330">사용자 요청</text><text class="small" x="205" y="370">입력 프롬프트</text><rect class="control" x="420" y="280" width="250" height="130" rx="16"/><text class="txt" x="545" y="330">Llama Guard</text><text class="small" x="545" y="370">위험 요청 분류</text><rect class="control" x="760" y="280" width="250" height="130" rx="16"/><text class="txt" x="885" y="330">NeMo Guardrails</text><text class="small" x="885" y="370">대화 흐름 제한</text><rect class="box" x="1060" y="280" width="140" height="130" rx="16"/><text class="txt" x="1130" y="330">정책</text><text class="small" x="1130" y="370">적용</text></g><path class="line" d="M330 345h90M670 345h90M1010 345h50"/><text class="foot" x="60" y="666">2단계 · 1 / 9</text></svg>
